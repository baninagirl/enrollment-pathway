<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kumon Hub — Activity</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#F5F6FA; --surface:#FFFFFF; --surface-2:#FBFBFE; --border:#E1E4EB;
    --ink:#1B1F27; --ink-muted:#636C7C; --ink-faint:#9AA1AF;
    --accent:#3454D1; --accent-ink:#FFFFFF; --accent-soft:#E9EDFC; --accent-soft-ink:#2A41A8;
    --good:#1E8E5A; --good-soft:#E4F5EC; --warn:#C2831F; --warn-soft:#FBF0E1; --bad:#C23B2B; --bad-soft:#FBE8E5;
    --shadow: 0 1px 2px rgba(16,20,30,.04), 0 2px 8px rgba(16,20,30,.06), 0 20px 40px -20px rgba(16,20,30,.25);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14161C; --surface:#1C1F27; --surface-2:#20232C; --border:#2C303B;
      --ink:#EDEFF4; --ink-muted:#9BA3B2; --ink-faint:#6B7280;
      --accent:#6C86F0; --accent-ink:#0E1220; --accent-soft:#232A47; --accent-soft-ink:#B7C3FA;
      --good:#4FC48A; --good-soft:#173226; --warn:#E0A23F; --warn-soft:#332711; --bad:#F0796A; --bad-soft:#3A1F1C;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161C; --surface:#1C1F27; --surface-2:#20232C; --border:#2C303B;
    --ink:#EDEFF4; --ink-muted:#9BA3B2; --ink-faint:#6B7280;
    --accent:#6C86F0; --accent-ink:#0E1220; --accent-soft:#232A47; --accent-soft-ink:#B7C3FA;
    --good:#4FC48A; --good-soft:#173226; --warn:#E0A23F; --warn-soft:#332711; --bad:#F0796A; --bad-soft:#3A1F1C;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--ink); margin:0;
    font-family:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.brand{ font-family:"Sora", system-ui, sans-serif; }
  h1,h2,h3{ text-wrap:balance; margin:0; }
  button{ font-family:inherit; }
  a{ color:var(--accent); }

  .app{ display:grid; grid-template-columns: 216px 1fr; min-height:100vh; min-height:100dvh; }
  .rail{
    background:var(--surface); border-right:1px solid var(--border);
    padding:20px 12px; display:flex; flex-direction:column; gap:4px;
    position:sticky; top:0; align-self:start; height:100vh; height:100dvh;
  }
  .brand{ font-weight:700; font-size:16px; padding:6px 10px 18px; display:flex; align-items:center; gap:8px; color:var(--ink); }
  .brand .dot{ width:9px;height:9px;border-radius:50%;background:var(--accent); flex:none; }
  .navbtn{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px;
    border:none; background:transparent; color:var(--ink-muted); font-size:14px; font-weight:600;
    cursor:pointer; text-align:left; width:100%; text-decoration:none;
    transition: background .12s ease, color .12s ease, box-shadow .12s ease;
  }
  .navbtn:hover{ background:var(--surface-2); color:var(--ink); }
  .navbtn.active{ background:var(--accent-soft); color:var(--accent-soft-ink); box-shadow: inset 3px 0 0 var(--accent); }
  .navbtn:focus-visible{ outline:none; box-shadow:0 0 0 3px var(--accent-soft); }
  .navbtn svg{ width:17px; height:17px; flex:none; }
  .rail-pages{ display:flex; flex-direction:column; gap:4px; margin-bottom:8px; }
  .rail-divider{ height:1px; background:var(--border); margin:4px 10px 10px; }
  .rail-account{ padding:0 10px 10px; }
  .account-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 8px; border-top:1px solid var(--border); font-size:12px; color:var(--ink-muted); }
  .account-email{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rail-foot{ margin-top:auto; padding:10px; font-size:12px; color:var(--ink-faint); line-height:1.5; }

  .main{ padding:26px 30px 60px; max-width:1000px; width:100%; min-width:0; }
  .page-head{ margin-bottom:18px; }
  .page-head h1{ font-size:22px; font-weight:700; }
  .page-sub{ color:var(--ink-muted); font-size:13.5px; margin-top:4px; }

  .btn{
    display:inline-flex; align-items:center; gap:7px; padding:9px 14px; border-radius:9px;
    font-size:13.5px; font-weight:600; border:1px solid var(--border); background:var(--surface);
    color:var(--ink); cursor:pointer; white-space:nowrap;
    transition:transform .08s ease, filter .08s ease, background .12s ease, box-shadow .12s ease;
  }
  .btn:hover{ background:var(--surface-2); }
  .btn:active{ transform:scale(.96); }
  .btn:focus-visible{ outline:none; box-shadow:0 0 0 3px var(--accent-soft); }
  .btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .btn.ghost{ border-color:transparent; background:transparent; }
  .btn.sm{ padding:6px 10px; font-size:12.5px; border-radius:7px; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; margin-bottom:18px; }
  .card-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--border); gap:10px; flex-wrap:wrap; }
  .card-head h3{ font-size:14.5px; font-weight:700; }
  .empty{ padding:30px 16px; text-align:center; color:var(--ink-muted); font-size:13.5px; }

  .filters-row{ display:flex; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border); flex-wrap:wrap; align-items:flex-end; }
  .filters-row .field{ min-width:150px; flex:1; }
  .filters-row .field.grow{ flex:2; min-width:200px; }

  .table-scroll{ overflow-x:auto; }
  .stable{ width:100%; border-collapse:collapse; }
  .stable th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-muted); padding:8px 16px; border-bottom:1px solid var(--border); }
  .stable td{ padding:10px 16px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle; }
  .stable tr:last-child td{ border-bottom:none; }
  .stable tbody tr td{ transition: background-color .12s ease; }
  .stable tbody tr:hover td{ background:var(--surface-2); }
  .pill{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:700; white-space:nowrap; }
  .pill.page-roster{ background:var(--accent-soft); color:var(--accent-soft-ink); }
  .pill.page-payments{ background:var(--good-soft); color:var(--good); }
  .pill.page-admin{ background:var(--bad-soft); color:var(--bad); }
  .pill.page-calendar{ background:var(--warn-soft); color:var(--warn); }
  .pill.page-absent{ background:var(--warn-soft); color:var(--warn); }
  .pill.page-index{ background:var(--surface-2); color:var(--ink-muted); }
  .pill.page-activity{ background:var(--surface-2); color:var(--ink-muted); }
  .muted{ color:var(--ink-muted); }
  .when-cell{ white-space:nowrap; }

  select, input[type=text], input[type=date]{
    font-family:inherit; font-size:13.5px; padding:8px 10px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); width:100%;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  select:focus, input:focus{ outline:none; border-color:var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  label.field{ display:flex; flex-direction:column; gap:5px; font-size:12.5px; font-weight:600; color:var(--ink-muted); }
  .hint{ font-size:12px; color:var(--ink-muted); font-weight:500; }

  .banner{ background:var(--warn-soft); color:var(--warn); border-radius:11px; padding:11px 14px; font-size:13px; font-weight:600; margin-bottom:16px; }
  .banner.info{ background:var(--accent-soft); color:var(--accent-soft-ink); }

  .login-screen{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg); z-index:100; padding:20px; }
  .login-card{ width:100%; max-width:360px; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:28px 26px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:14px; }
  .login-brand{ font-family:"Sora", system-ui, sans-serif; font-weight:700; font-size:18px; display:flex; align-items:center; gap:8px; color:var(--ink); }
  .login-brand .dot{ width:9px; height:9px; border-radius:50%; background:var(--accent); flex:none; }
  .login-sub{ font-size:13px; color:var(--ink-muted); margin:-6px 0 4px; }
  .login-error{ background:var(--bad-soft); color:var(--bad); border-radius:9px; padding:9px 12px; font-size:12.5px; font-weight:600; }

  [hidden]{ display:none !important; }

  @media (max-width: 860px){
    .app{ grid-template-columns:1fr; }
    .rail{ position:fixed; bottom:0; left:0; right:0; top:auto; height:auto; flex-direction:row; padding:8px; border-right:none; border-top:1px solid var(--border); z-index:40; }
    .brand, .rail-foot, .rail-account{ display:none; }
    .rail-pages{ flex-direction:row; flex:1; margin-bottom:0; }
    .rail-divider{ display:none; }
    .navbtn{ text-align:center; justify-content:center; }
    .main{ padding:16px 14px calc(70px + env(safe-area-inset-bottom)); }
    .stable th, .stable td{ padding:9px 8px; font-size:12.5px; }
    .filters-row .field{ min-width:100%; }
  }
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <form class="login-card" id="loginForm">
    <div class="login-brand"><span class="dot"></span>Kumon Hub</div>
    <div class="login-sub">Sign in with your team account.</div>
    <div class="login-error" id="loginError" hidden></div>
    <label class="field">Email<input type="email" name="email" required autocomplete="username" autofocus></label>
    <label class="field">Password<input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn primary" type="submit" style="justify-content:center;">Log in</button>
  </form>
</div>

<div class="app" id="appRoot" hidden>
  <nav class="rail">
    <div class="brand"><span class="dot"></span>Kumon Hub</div>
    <div class="rail-pages">
      <a class="navbtn" href="index.html" id="navPipelineLink" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16l-6.5 8.5V19l-3 1.5v-8L4 4z"/></svg>Pipeline</a>
      <a class="navbtn" href="roster.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3L2 8l10 5 10-5-10-5z"/><path d="M6 10.5V15c0 1.5 2.5 3 6 3s6-1.5 6-3v-4.5"/></svg>Student roster</a>
      <a class="navbtn" href="calendar.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</a>
      <a class="navbtn" href="payments.html" id="navPaymentsLink" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>Payments</a>
      <a class="navbtn" href="absent.html" id="navAbsentLink" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-7 8-7s8 3 8 7"/><path d="M2 2l20 20"/></svg>Retention</a>
      <a class="navbtn" href="admin.html" id="navAdminLink" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 5-3.5 8-7 9-3.5-1-7-4-7-9V6l7-3z"/></svg>Admin</a>
      <a class="navbtn active" href="activity.html" id="navActivityLink" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>Activity</a>
    </div>
    <div class="rail-divider"></div>
    <div class="rail-account" id="railAccount"></div>
    <div class="rail-foot">Who changed what, and when.</div>
  </nav>

  <main class="main">
    <div class="page-head">
      <h1>Activity</h1>
      <div class="page-sub">A running log of who edited what, across every page — similar to a document's version history.</div>
    </div>

    <div id="activityBody"></div>
  </main>
</div>

<script>
(function(){
  "use strict";

  const SUPABASE_URL = "https://bcnmsryahczapnxbpkve.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJjbm1zcnlhaGN6YXBueGJwa3ZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMDQ4NzksImV4cCI6MjEwNTc4MDg3OX0.VgCX3CR7YCJxR9-vwD8HlYcCx0MxlY7atgD_0h3F3to";

  const $ = (sel, el) => (el||document).querySelector(sel);
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  const PAGE_LABELS = {
    index: "Pipeline", roster: "Student roster", payments: "Payments",
    admin: "Admin", calendar: "Calendar", absent: "Retention", activity: "Activity"
  };

  let sbClient = null, currentUser = null, currentRole = null, profiles = [];
  let entries = [];
  const PAGE_SIZE = 100;
  let offset = 0;
  let hasMore = true;
  let loading = false;
  // Separate from `offset` on purpose — `offset` is just where the NEXT page query starts
  // (so it's almost never 0 once anything has loaded), while this tracks whether the admin
  // has clicked "Load more" and is now looking further back. Realtime inserts only prepend
  // while this is false, so paging back in time never gets silently reshuffled underneath them.
  let pagedFurther = false;
  const filters = { page: "all", actor: "all", since: "", search: "" };

  function showLogin(errMsg){
    $("#loginScreen").hidden = false;
    $("#appRoot").hidden = true;
    const err = $("#loginError");
    if(errMsg){ err.textContent = errMsg; err.hidden = false; } else { err.hidden = true; }
  }
  function showApp(){ $("#loginScreen").hidden = true; $("#appRoot").hidden = false; }
  function renderAccount(){
    const el = $("#railAccount");
    if(el) el.innerHTML = currentUser ? `<div class="account-row"><span class="account-email">${esc(currentUser.email)}</span><button class="btn sm ghost" data-action="logout">Log out</button></div>` : "";
    const pipelineLink = $("#navPipelineLink");
    if(pipelineLink) pipelineLink.hidden = currentRole === "teacher" || currentRole === "pending";
    const paymentsLink = $("#navPaymentsLink");
    if(paymentsLink) paymentsLink.hidden = !(currentRole === "admin" || currentRole === "superadmin" || currentRole === "teacher");
    const absentLink = $("#navAbsentLink");
    if(absentLink) absentLink.hidden = !(currentRole === "admin" || currentRole === "superadmin" || currentRole === "teacher" || currentRole === "trainer_teacher");
    const adminLink = $("#navAdminLink");
    if(adminLink) adminLink.hidden = currentRole !== "superadmin";
    const activityLink = $("#navActivityLink");
    if(activityLink) activityLink.hidden = !(currentRole === "admin" || currentRole === "superadmin");
  }

  async function loadRole(){
    if(!sbClient || !currentUser){ currentRole = null; return; }
    try{
      const { data, error } = await sbClient.from("profiles").select("role").eq("id", currentUser.id).maybeSingle();
      if(error) throw error;
      currentRole = data ? data.role : "pending";
    }catch(e){
      console.warn("couldn't load role", e);
      currentRole = "pending";
    }
  }

  function isAuthorized(){ return currentRole === "admin" || currentRole === "superadmin"; }

  let started = false;
  async function boot(){
    if(!window.supabase){ showLogin("Couldn't load Supabase."); return; }
    try{ sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }
    catch(e){ showLogin("Couldn't connect to Supabase."); return; }

    const { data:{ session } } = await sbClient.auth.getSession();
    if(session){ currentUser = session.user; showApp(); await loadRole(); renderAccount(); await startApp(); }
    else{ showLogin(); }

    sbClient.auth.onAuthStateChange(async (event, session)=>{
      if(session){
        currentUser = session.user;
        showApp(); await loadRole(); renderAccount(); await startApp();
      }else{
        currentUser = null; currentRole = null; started = false;
        showLogin();
      }
    });
  }

  async function startApp(){
    renderActivity();
    if(!isAuthorized() || started) return;
    started = true;
    profiles = await loadProfiles();
    await loadEntries(true);
    renderActivity();

    // Live updates — a fresh entry from any page shows up here without a manual refresh,
    // same spirit as the rest of the hub's realtime tables. Only prepend while still on the
    // first page so paging further back never gets silently reshuffled.
    sbClient.channel("realtime:edit_history")
      .on("postgres_changes", { event:"INSERT", schema:"public", table:"edit_history" }, (payload)=>{
        if(pagedFurther) return;
        if(!matchesFilters(payload.new)) return;
        entries = [payload.new, ...entries].slice(0, PAGE_SIZE);
        renderActivity();
      })
      .subscribe();
  }

  async function loadProfiles(){
    const { data, error } = await sbClient.from("profiles").select("id,email").order("email");
    if(error){ console.warn(error); return []; }
    return data || [];
  }

  function matchesFilters(row){
    if(filters.page !== "all" && row.page !== filters.page) return false;
    if(filters.actor !== "all" && row.actor_email !== filters.actor) return false;
    if(filters.since && new Date(row.created_at) < new Date(filters.since + "T00:00:00")) return false;
    if(filters.search.trim()){
      const q = filters.search.trim().toLowerCase();
      if(!(row.summary||"").toLowerCase().includes(q)) return false;
    }
    return true;
  }

  async function loadEntries(reset){
    if(loading) return;
    loading = true;
    if(reset){ offset = 0; entries = []; hasMore = true; pagedFurther = false; }
    else{ pagedFurther = true; }
    let query = sbClient.from("edit_history").select("*").order("created_at", { ascending:false }).range(offset, offset + PAGE_SIZE - 1);
    if(filters.page !== "all") query = query.eq("page", filters.page);
    if(filters.actor !== "all") query = query.eq("actor_email", filters.actor);
    if(filters.since) query = query.gte("created_at", filters.since + "T00:00:00");
    if(filters.search.trim()) query = query.ilike("summary", `%${filters.search.trim()}%`);
    const { data, error } = await query;
    loading = false;
    if(error){ console.warn(error); return; }
    const rows = data || [];
    entries = reset ? rows : entries.concat(rows);
    hasMore = rows.length === PAGE_SIZE;
    offset = entries.length;
  }

  function fmtWhen(iso){
    const d = new Date(iso);
    return d.toLocaleString(undefined, { month:"short", day:"numeric", year:"numeric", hour:"numeric", minute:"2-digit" });
  }
  function pillClassFor(page){ return PAGE_LABELS[page] ? `page-${page}` : ""; }

  function renderActivity(){
    const body = $("#activityBody");
    if(!isAuthorized()){
      body.innerHTML = currentRole === "pending"
        ? `<div class="banner">Your account (${esc(currentUser ? currentUser.email : "")}) is waiting for approval. Ask an existing superadmin to set your role.</div>`
        : `<div class="banner">Your account (${esc(currentUser ? currentUser.email : "")}) doesn't have access to Activity — admin or superadmin only. If that's wrong, ask a superadmin to update your role.</div>`;
      return;
    }
    const pageOptions = Object.keys(PAGE_LABELS).map(p => `<option value="${p}" ${filters.page===p?"selected":""}>${esc(PAGE_LABELS[p])}</option>`).join("");
    const actorOptions = profiles.map(p => `<option value="${esc(p.email)}" ${filters.actor===p.email?"selected":""}>${esc(p.email)}</option>`).join("");
    body.innerHTML = `
      <div class="card">
        <div class="filters-row">
          <label class="field">Page
            <select id="pageFilter"><option value="all">All pages</option>${pageOptions}</select>
          </label>
          <label class="field">Person
            <select id="actorFilter"><option value="all">Everyone</option>${actorOptions}</select>
          </label>
          <label class="field">Since
            <input type="date" id="sinceFilter" value="${esc(filters.since)}">
          </label>
          <label class="field grow">Search
            <input type="text" id="searchFilter" placeholder="Search what happened…" value="${esc(filters.search)}">
          </label>
        </div>
        <div class="card-head"><h3>${entries.length} ${entries.length===1?"entry":"entries"}</h3><span class="hint">Newest first</span></div>
        <div class="table-scroll">
          <table class="stable">
            <thead><tr><th>When</th><th>Page</th><th>Who</th><th>What happened</th></tr></thead>
            <tbody id="activityBodyRows">
              ${entries.length ? entries.map(rowHtml).join("") : `<tr><td colspan="4"><div class="empty">Nothing logged yet — actions across the hub will start showing up here.</div></td></tr>`}
            </tbody>
          </table>
        </div>
        ${hasMore ? `<div style="padding:14px 16px; text-align:center;"><button class="btn" id="loadMoreBtn">Load more</button></div>` : ""}
      </div>
    `;
  }

  function rowHtml(e){
    return `<tr>
      <td class="when-cell muted">${esc(fmtWhen(e.created_at))}</td>
      <td><span class="pill ${pillClassFor(e.page)}">${esc(PAGE_LABELS[e.page] || e.page)}</span></td>
      <td class="muted">${esc(e.actor_email || "—")}</td>
      <td>${esc(e.summary)}</td>
    </tr>`;
  }

  document.addEventListener("submit", async (e)=>{
    if(e.target.id === "loginForm"){
      e.preventDefault();
      const fd = new FormData(e.target);
      const { error } = await sbClient.auth.signInWithPassword({ email: fd.get("email"), password: fd.get("password") });
      if(error) showLogin(error.message);
      return;
    }
  });

  document.addEventListener("click", async (e)=>{
    const btn = e.target.closest("[data-action]");
    if(btn && btn.dataset.action === "logout"){ await sbClient.auth.signOut(); return; }
    if(e.target && e.target.id === "loadMoreBtn"){ await loadEntries(false); renderActivity(); }
  });

  document.addEventListener("change", async (e)=>{
    if(e.target.id === "pageFilter"){ filters.page = e.target.value; await loadEntries(true); renderActivity(); }
    if(e.target.id === "actorFilter"){ filters.actor = e.target.value; await loadEntries(true); renderActivity(); }
    if(e.target.id === "sinceFilter"){ filters.since = e.target.value; await loadEntries(true); renderActivity(); }
  });

  let searchTimer = null;
  document.addEventListener("input", (e)=>{
    if(e.target.id === "searchFilter"){
      filters.search = e.target.value;
      clearTimeout(searchTimer);
      // The full filters row (search box included) gets redrawn on every render, so restore
      // focus and cursor position afterward — otherwise each debounced search re-render would
      // kick the cursor out of the box mid-type.
      searchTimer = setTimeout(async ()=>{
        await loadEntries(true);
        renderActivity();
        const box = $("#searchFilter");
        if(box){ box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
      }, 350);
    }
  });

  boot();
})();
</script>
</body>
</html>
