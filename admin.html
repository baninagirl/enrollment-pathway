<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kumon Hub — Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#F5F6FA; --surface:#FFFFFF; --surface-2:#FBFBFE; --border:#E1E4EB;
    --ink:#1B1F27; --ink-muted:#636C7C; --ink-faint:#9AA1AF;
    --accent:#3454D1; --accent-ink:#FFFFFF; --accent-soft:#E9EDFC; --accent-soft-ink:#2A41A8;
    --good:#1E8E5A; --good-soft:#E4F5EC; --warn:#C2831F; --warn-soft:#FBF0E1; --bad:#C23B2B; --bad-soft:#FBE8E5;
    --shadow: 0 1px 2px rgba(16,20,30,.04), 0 2px 8px rgba(16,20,30,.06), 0 20px 40px -20px rgba(16,20,30,.25);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14161C; --surface:#1C1F27; --surface-2:#20232C; --border:#2C303B;
      --ink:#EDEFF4; --ink-muted:#9BA3B2; --ink-faint:#6B7280;
      --accent:#6C86F0; --accent-ink:#0E1220; --accent-soft:#232A47; --accent-soft-ink:#B7C3FA;
      --good:#4FC48A; --good-soft:#173226; --warn:#E0A23F; --warn-soft:#332711; --bad:#F0796A; --bad-soft:#3A1F1C;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161C; --surface:#1C1F27; --surface-2:#20232C; --border:#2C303B;
    --ink:#EDEFF4; --ink-muted:#9BA3B2; --ink-faint:#6B7280;
    --accent:#6C86F0; --accent-ink:#0E1220; --accent-soft:#232A47; --accent-soft-ink:#B7C3FA;
    --good:#4FC48A; --good-soft:#173226; --warn:#E0A23F; --warn-soft:#332711; --bad:#F0796A; --bad-soft:#3A1F1C;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--ink); margin:0;
    font-family:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.brand{ font-family:"Sora", system-ui, sans-serif; }
  h1,h2,h3{ text-wrap:balance; margin:0; }
  button{ font-family:inherit; }
  a{ color:var(--accent); }

  .app{ display:grid; grid-template-columns: 216px 1fr; min-height:100vh; min-height:100dvh; }
  .rail{
    background:var(--surface); border-right:1px solid var(--border);
    padding:20px 12px; display:flex; flex-direction:column; gap:4px;
    position:sticky; top:0; align-self:start; height:100vh; height:100dvh;
  }
  .brand{ font-weight:700; font-size:16px; padding:6px 10px 18px; display:flex; align-items:center; gap:8px; color:var(--ink); }
  .brand .dot{ width:9px;height:9px;border-radius:50%;background:var(--accent); flex:none; }
  .navbtn{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px;
    border:none; background:transparent; color:var(--ink-muted); font-size:14px; font-weight:600;
    cursor:pointer; text-align:left; width:100%; text-decoration:none;
    transition: background .12s ease, color .12s ease, box-shadow .12s ease;
  }
  .navbtn:hover{ background:var(--surface-2); color:var(--ink); }
  .navbtn.active{ background:var(--accent-soft); color:var(--accent-soft-ink); box-shadow: inset 3px 0 0 var(--accent); }
  .navbtn:focus-visible{ outline:none; box-shadow:0 0 0 3px var(--accent-soft); }
  .navbtn svg{ width:17px; height:17px; flex:none; }
  .rail-pages{ display:flex; flex-direction:column; gap:4px; margin-bottom:8px; }
  .rail-divider{ height:1px; background:var(--border); margin:4px 10px 10px; }
  .rail-account{ padding:0 10px 10px; }
  .account-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 8px; border-top:1px solid var(--border); font-size:12px; color:var(--ink-muted); }
  .account-email{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rail-foot{ margin-top:auto; padding:10px; font-size:12px; color:var(--ink-faint); line-height:1.5; }

  .main{ padding:26px 30px 60px; max-width:900px; width:100%; min-width:0; }
  .page-head{ margin-bottom:18px; }
  .page-head h1{ font-size:22px; font-weight:700; }
  .page-sub{ color:var(--ink-muted); font-size:13.5px; margin-top:4px; }

  .btn{
    display:inline-flex; align-items:center; gap:7px; padding:9px 14px; border-radius:9px;
    font-size:13.5px; font-weight:600; border:1px solid var(--border); background:var(--surface);
    color:var(--ink); cursor:pointer; white-space:nowrap;
    transition:transform .08s ease, filter .08s ease, background .12s ease, box-shadow .12s ease;
  }
  .btn:hover{ background:var(--surface-2); }
  .btn:active{ transform:scale(.96); }
  .btn:focus-visible{ outline:none; box-shadow:0 0 0 3px var(--accent-soft); }
  .btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .btn.ghost{ border-color:transparent; background:transparent; }
  .btn.sm{ padding:6px 10px; font-size:12.5px; border-radius:7px; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; margin-bottom:18px; }
  .card-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--border); gap:10px; flex-wrap:wrap; }
  .card-head h3{ font-size:14.5px; font-weight:700; }
  .empty{ padding:30px 16px; text-align:center; color:var(--ink-muted); font-size:13.5px; }

  .table-scroll{ overflow-x:auto; }
  .stable{ width:100%; border-collapse:collapse; }
  .stable th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-muted); padding:8px 16px; border-bottom:1px solid var(--border); }
  .stable td{ padding:10px 16px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle; }
  .stable tr:last-child td{ border-bottom:none; }
  .stable tbody tr td{ transition: background-color .12s ease; }
  .stable tbody tr:hover td{ background:var(--surface-2); }
  .pill{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:700; white-space:nowrap; transition: background-color .15s ease, color .15s ease; }
  .pill.super{ background:var(--accent-soft); color:var(--accent-soft-ink); }
  .pill.admin{ background:var(--surface-2); color:var(--ink-muted); }
  .role-select, .teacher-name-select{ font-family:inherit; font-size:12.5px; padding:6px 8px; border-radius:7px; border:1px solid var(--border); background:var(--surface); color:var(--ink); transition: border-color .15s ease, box-shadow .15s ease; }
  .role-select:focus, .teacher-name-select:focus{ outline:none; border-color:var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .pill.removed{ background:var(--bad-soft, #FBE8E5); color:var(--bad, #C23B2B); }
  .removed-row td{ color:var(--ink-muted); }
  .btn.danger-ghost{ color:var(--bad, #C23B2B); border-color:transparent; background:transparent; }
  .btn.danger-ghost:hover{ background:var(--bad-soft, #FBE8E5); }
  .you-tag{ font-size:11px; color:var(--ink-faint); font-weight:600; }

  select, input[type=text], input[type=number], input[type=date], input[type=email], input[type=password]{
    font-family:inherit; font-size:13.5px; padding:8px 10px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); width:100%;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  select:focus, input:focus{ outline:none; border-color:var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  label.field{ display:flex; flex-direction:column; gap:5px; font-size:12.5px; font-weight:600; color:var(--ink-muted); }
  .hint{ font-size:12px; color:var(--ink-muted); font-weight:500; }

  .banner{ background:var(--warn-soft); color:var(--warn); border-radius:11px; padding:11px 14px; font-size:13px; font-weight:600; margin-bottom:16px; }
  .banner.info{ background:var(--accent-soft); color:var(--accent-soft-ink); }
  .banner.good{ background:var(--good-soft); color:var(--good); }

  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .modal-backdrop{ position:fixed; inset:0; background:rgba(10,12,18,.5); display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; overflow-y:auto; z-index:50; }
  .modal{ background:var(--surface); border-radius:16px; width:100%; max-width:420px; box-shadow:var(--shadow); }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--border); }
  .modal-head h3{ font-size:15.5px; font-weight:700; }
  .modal-body{ padding:16px 18px; display:flex; flex-direction:column; gap:12px; max-height:66vh; overflow-y:auto; }
  .modal-foot{ display:flex; justify-content:flex-end; gap:8px; padding:14px 18px; border-top:1px solid var(--border); }
  .iconbtn{ border:none; background:transparent; cursor:pointer; color:var(--ink-muted); padding:4px; border-radius:6px; transition: transform .08s ease, background .12s ease; }
  .iconbtn:active{ transform:scale(.9); }
  .iconbtn:hover{ background:var(--surface-2); color:var(--ink); }

  .login-screen{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg); z-index:100; padding:20px; }
  .login-card{ width:100%; max-width:360px; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:28px 26px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:14px; }
  .login-brand{ font-family:"Sora", system-ui, sans-serif; font-weight:700; font-size:18px; display:flex; align-items:center; gap:8px; color:var(--ink); }
  .login-brand .dot{ width:9px; height:9px; border-radius:50%; background:var(--accent); flex:none; }
  .login-sub{ font-size:13px; color:var(--ink-muted); margin:-6px 0 4px; }
  .login-error{ background:var(--bad-soft); color:var(--bad); border-radius:9px; padding:9px 12px; font-size:12.5px; font-weight:600; }
  .link-btn{ background:none; border:none; color:var(--accent); font-size:12.5px; font-weight:600; cursor:pointer; padding:2px; align-self:center; }
  .link-btn:hover{ text-decoration:underline; }

  [hidden]{ display:none !important; }

  @media (max-width: 860px){
    .app{ grid-template-columns:1fr; }
    .rail{ position:fixed; bottom:0; left:0; right:0; top:auto; height:auto; flex-direction:row; padding:8px; border-right:none; border-top:1px solid var(--border); z-index:40; }
    .brand, .rail-foot, .rail-account{ display:none; }
    .rail-pages{ flex-direction:row; flex:1; margin-bottom:0; }
    .rail-divider{ display:none; }
    .navbtn{ text-align:center; justify-content:center; }
    .main{ padding:16px 14px calc(70px + env(safe-area-inset-bottom)); }
    .stable th, .stable td{ padding:9px 8px; font-size:12.5px; }
  }

  /* ===== Shared across pages: collapsible sidebar + fit-to-screen ===== */
  :root{ --rail-w:216px; --z:1; }
  html.rail-collapsed{ --rail-w:68px; }
  .rail-toggle{ display:none; }
  .rail-pipeline .rail-section-label{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); padding:2px 10px 6px; }
  .rail-pipeline{ display:flex; flex-direction:column; gap:4px; margin-bottom:8px; }
  @media (min-width:1600px){ :root{ --z:1.1; } }
  @media (min-width:1900px){ :root{ --z:1.2; } }
  @media (min-width:2300px){ :root{ --z:1.4; } }
  @media (min-width:2800px){ :root{ --z:1.7; } }
  @media (min-width:3400px){ :root{ --z:2; } }
  @media (min-width:861px){
    /* Big screens: the page fills the window and everything scales up together (steps above), instead of
       sitting in a narrow column with tiny text and empty space on the right. */
    body{ zoom:var(--z); }
    .app{ grid-template-columns:var(--rail-w) minmax(0,1fr); min-height:calc(100dvh / var(--z)); transition:grid-template-columns .18s ease; }
    .rail{ height:calc(100dvh / var(--z)); overflow-y:auto; overflow-x:hidden; }
    .main{ max-width:none; }
    .rail-pipeline-mobile{ display:none !important; }
    .rail-toggle{ display:inline-flex; position:absolute; top:20px; right:10px; width:28px; height:28px; align-items:center; justify-content:center; border:1px solid var(--border); background:var(--surface); color:var(--ink-muted); border-radius:8px; cursor:pointer; padding:0; }
    .rail-toggle:hover{ background:var(--surface-2); color:var(--ink); }
    .rail-toggle svg{ width:15px; height:15px; transition:transform .18s ease; }
    html.rail-collapsed .rail-toggle svg{ transform:rotate(180deg); }
    html.rail-collapsed .rail{ padding:20px 8px; }
    html.rail-collapsed .rail-toggle{ position:static; align-self:center; margin-bottom:12px; }
    html.rail-collapsed .brand{ display:none; }
    html.rail-collapsed .navbtn{ font-size:0; justify-content:center; padding:10px 0; position:relative; gap:0; }
    html.rail-collapsed .navbtn svg{ width:19px; height:19px; }
    html.rail-collapsed .navbtn .badge{ position:absolute; top:3px; right:8px; font-size:10px; margin:0; padding:0 4px; min-width:15px; line-height:15px; }
    html.rail-collapsed .rail-section-label, html.rail-collapsed .rail-account, html.rail-collapsed .rail-foot{ display:none; }
    html.rail-collapsed .rail-divider{ margin:6px 8px; }
  }
  @media (max-width:860px){ .rail-pipeline{ display:none !important; } }
</style>
<script>try{if(localStorage.getItem("kumonRailCollapsed")==="1")document.documentElement.classList.add("rail-collapsed")}catch(e){}</script>
<script>
/* PTC menu link + "due" number (phase97). Each page calls kumonPtcNav(sbClient, role) once the role is known. */
window.kumonPtcNav = function(client, role){
  var link = document.getElementById("navPtcLink"); if(!link) return;
  var ok = ["admin","superadmin","teacher","trainer_teacher"].indexOf(role) >= 0;
  link.hidden = !ok;
  var proj = document.getElementById("navProjLink"); if(proj) proj.hidden = !ok;
  // Today (Nov 9): the morning page — added here so every page gets the link, first in the menu.
  var td = document.getElementById("navTodayLink");
  if(!td && ok){
    var tbox = document.querySelector(".rail-pages");
    if(tbox){
      td = document.createElement("a"); td.className = "navbtn"; td.id = "navTodayLink"; td.href = "today.html"; td.title = "Today";
      td.innerHTML = (tbox.querySelector(".navbtn svg") ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>' : "") + 'Today';
      if(/today\.html$/.test(location.pathname)) td.classList.add("active");
      var firstLink = tbox.querySelector(".navbtn:not(.rail-pipeline-mobile)");
      tbox.insertBefore(td, firstLink || tbox.firstChild);
    }
  }
  if(td) td.hidden = !ok;
  // Worksheets (phase118): admins and superadmins only — the link is added here so every page gets it.
  var wsAdm = role === "admin" || role === "superadmin", ws = document.getElementById("navWsLink");
  if(!ws && wsAdm){
    var after = document.getElementById("navReportsLink") || document.getElementById("navActivityLink") || document.getElementById("navAdminLink");
    var box = after ? after.parentNode : document.querySelector(".rail-pages");
    if(box){
      ws = document.createElement("a"); ws.className = "navbtn"; ws.id = "navWsLink"; ws.href = "worksheets.html"; ws.title = "Worksheets";
      ws.innerHTML = (box.querySelector(".navbtn svg") ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10v4H7zM5 7h14v14H5z"/><path d="M9 12h6M9 16h4"/></svg>' : "") + 'Worksheets';   // icon only where the menu has icons
      if(/worksheets\.html$/.test(location.pathname)) ws.classList.add("active");
      if(after && after.nextSibling) box.insertBefore(ws, after.nextSibling); else box.appendChild(ws);
    }
  }
  if(ws) ws.hidden = !wsAdm;
  // Admin tools (Nov 9): on computers, Admin, Activity, Reports and Worksheets sit in their own "Admin" section
  // at the bottom of the menu so teachers' links aren't mixed with them. On phones they stay in the bottom bar.
  if(!window.__kumonAdminGroup){
    window.__kumonAdminGroup = true;
    var ids = ["navReportsLink", "navWsLink", "navAdminLink", "navActivityLink"];   // the order they show in
    var place = function(){
      var pages = document.querySelector(".rail-pages"); if(!pages) return;
      var grp = document.getElementById("navAdminGroup");
      if(!grp){
        grp = document.createElement("div"); grp.className = "rail-admin"; grp.id = "navAdminGroup";
        grp.innerHTML = '<div class="rail-divider"></div><div class="rail-section-label">Admin</div>';
        var acct = document.getElementById("railAccount");
        if(acct && acct.parentNode) acct.parentNode.insertBefore(grp, acct); else pages.parentNode.appendChild(grp);
      }
      var wide = !window.matchMedia || window.matchMedia("(min-width: 861px)").matches;
      ids.forEach(function(id){ var a = document.getElementById(id); if(!a) return; if(wide) grp.appendChild(a); else if(a.parentNode !== pages) pages.appendChild(a); });
      // Settings (from Pipeline views) goes last in the Admin section; same people see it as before (whoever sees Pipeline)
      var st = document.getElementById("navSettingsLink") || document.querySelector('.rail a.navbtn[href="index.html#settings"], .rail button.navbtn[data-tab="settings"]');
      if(st){
        if(!st.id) st.id = "navSettingsLink";
        if(!st.__home){ st.__home = st.parentNode; st.__next = st.nextSibling; }
        var pl = document.getElementById("navPipelineLink");
        if(st.tagName === "A") st.hidden = pl ? pl.hidden : false;
        if(wide){ if(st.parentNode !== grp || grp.lastElementChild !== st) grp.appendChild(st); }
        else if(st.parentNode !== st.__home){ st.__home.insertBefore(st, st.__next && st.__next.parentNode === st.__home ? st.__next : null); }
      }
      var any = ids.concat(["navSettingsLink"]).some(function(id){ var a = document.getElementById(id); return a && !a.hidden && a.parentNode === grp; });
      grp.hidden = !any;
    };
    window.__kumonPlaceAdmin = place;
    if(window.matchMedia){ var mq = window.matchMedia("(min-width: 861px)"); if(mq.addEventListener) mq.addEventListener("change", place); else if(mq.addListener) mq.addListener(place); }
    // pages decide who sees each link a moment after this runs, so look again when that changes
    if(window.MutationObserver){ var mo = new MutationObserver(function(){ place(); }); ids.concat(["navPipelineLink"]).forEach(function(id){ var a = document.getElementById(id); if(a) mo.observe(a, { attributes: true, attributeFilter: ["hidden"] }); }); }
    setTimeout(place, 0); setTimeout(place, 800);
  }
  if(window.__kumonPlaceAdmin) window.__kumonPlaceAdmin();
  if(!ok || !client) return;
  if(!document.getElementById("ptcBadgeStyle")){
    var st = document.createElement("style"); st.id = "ptcBadgeStyle";
    st.textContent = ".navbtn .ptc-badge{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 6px;min-width:18px;text-align:center;line-height:16px;}";
    document.head.appendChild(st);
  }
  // An expired sign-in (a tab left open in the background) is renewed and the count asked again once;
  // with no sign-in at all it doesn't ask. A failed check keeps the last number instead of hiding it.
  var expired = function(r){ var e = r && r.error; return !!e && (e.status === 401 || /jwt|expired|401/i.test(String(e.message || e.code || ""))); };
  var refresh = function(){
    var ask = function(){ return client.rpc("ptc_due_count"); };
    client.auth.getSession().then(function(s){
      if(!s || !s.data || !s.data.session) return null;
      return ask().then(function(r){
        if(!expired(r)) return r;
        return client.auth.refreshSession().then(function(x){ return (x && x.data && x.data.session) ? ask() : null; }, function(){ return null; });
      });
    }).then(function(r){
      var b = document.getElementById("navPtcBadge"); if(!b || !r || r.error || typeof r.data !== "number") return;
      var n = r.data;
      b.textContent = n > 99 ? "99+" : String(n); b.hidden = !n;
      link.title = n ? ("PTC — " + n + " due") : "PTC";
    }, function(){});
  };
  refresh();
  window.kumonPtcNavRefresh = refresh;
  if(!window.__ptcNavTimer) window.__ptcNavTimer = setInterval(refresh, 5 * 60 * 1000);
};
</script>
<script>
/* Sign-in resilience (Oct 23). A slow or dropped connection used to make the page think the account had no role
   ("waiting for approval — ask a superadmin"), and a hiccup while renewing the sign-in could log people out.
   kumonFetchProfile retries, renews the sign-in if it expired, and — only if the Hub still can't be reached —
   uses the last role this account had on this browser instead of "pending". */
(function(){
  var sleep = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };
  function notice(msg){
    var el = document.getElementById("kumonNetNotice");
    if(!msg){ if(el) el.remove(); return; }
    if(!el){
      el = document.createElement("div"); el.id = "kumonNetNotice";
      el.style.cssText = "position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:200;background:#1B1F27;color:#fff;font:600 13px Inter,system-ui,sans-serif;padding:9px 14px;border-radius:10px;box-shadow:0 8px 24px -10px rgba(0,0,0,.4)";
      (document.body || document.documentElement).appendChild(el);
    }
    el.textContent = msg;
  }
  window.kumonFetchProfile = async function(client, uid, cols){
    var key = "kumonProfile:" + uid, cached = null;
    try{ cached = JSON.parse(localStorage.getItem(key) || "null"); }catch(e){}
    var want = String(cols).split(",").map(function(s){ return s.trim(); }).filter(Boolean);
    var cacheOk = cached && cached.role && cached.role !== "pending" && want.every(function(k){ return k in cached; });
    var once = async function(){ try{ return await client.from("profiles").select(cols).eq("id", uid).maybeSingle(); }catch(e){ return { data:null, error:e }; } };
    for(var attempt = 0; ; attempt++){
      var r = await once();
      if(!r.error && !r.data && attempt === 0){
        // An expired sign-in can read as "no profile" instead of an error: renew it and ask once more.
        try{ await client.auth.refreshSession(); }catch(e){}
        r = await once();
      }
      if(!r.error){
        if(r.data){ try{ localStorage.setItem(key, JSON.stringify(Object.assign({}, cached || {}, r.data))); }catch(e){} }
        notice(null);
        return { data: r.data, error: null };
      }
      var msg = String((r.error && (r.error.message || r.error.code)) || "");
      if(/jwt|token|expired|401|auth/i.test(msg)){ try{ await client.auth.refreshSession(); }catch(e){} }
      if(cacheOk && attempt >= 2){ notice(null); return { data: cached, error: null, fromCache: true }; }
      notice("Can't reach the Kumon Hub right now — trying again…");
      await sleep(Math.min(8000, 800 * (attempt + 1)));
    }
  };
  // Before treating a "signed out" event as real, make sure the sign-in is really gone (not a hiccup while renewing it).
  window.kumonStillSignedIn = async function(client, uid){
    if(window.__kumonLoggingOut) return false;
    await sleep(1200);
    try{ var a = await client.auth.getSession(); if(a && a.data && a.data.session && a.data.session.user.id === uid) return true; }catch(e){}
    if(window.__kumonLoggingOut) return false;
    try{ var b = await client.auth.refreshSession(); if(b && b.data && b.data.session && b.data.session.user.id === uid) return true; }catch(e){}
    return false;
  };
  // Mark a deliberate "Log out" click so it isn't second-guessed above; forget the remembered role on log out.
  document.addEventListener("click", function(e){
    var b = e.target && e.target.closest && e.target.closest('[data-action="logout"]');
    if(!b) return;
    window.__kumonLoggingOut = true;
    try{ Object.keys(localStorage).forEach(function(k){ if(k.indexOf("kumonProfile:") === 0) localStorage.removeItem(k); }); }catch(err){}
  }, true);
})();
</script>

  document.addEventListener("submit", async (e)=>{
    if(e.target.id === "loginForm"){
      e.preventDefault();
      const fd = new FormData(e.target);
      const { error } = await sbClient.auth.signInWithPassword({ email: fd.get("email"), password: fd.get("password") });
      if(error){ showLogin(error.message); }
      return;
    }
    if(e.target.id === "newLoginForm"){
      e.preventDefault();
      if(e.target.dataset.busy) return;   // a second click would try to sign the same email up again
      e.target.dataset.busy = "1";
      const subBtn = e.target.querySelector('button[type="submit"]'); if(subBtn) subBtn.disabled = true;
      try{ await createLogin(e.target); } finally{ if(e.target.isConnected){ delete e.target.dataset.busy; if(subBtn) subBtn.disabled = false; } }
    }
  });
  async function createLogin(form){
    {
      const fd = new FormData(form);
      const email = fd.get("email").toString().trim();
      const password = fd.get("password").toString();
      const role = fd.get("role").toString();
      const teacherName = fd.get("teacher_name") ? fd.get("teacher_name").toString().trim() : "";
      const errBox = $("#newLoginError");
      errBox.hidden = true;
      if((role === "teacher" || role === "trainer_teacher") && !teacherName){
        errBox.textContent = "Type or pick which teacher this is.";
        errBox.hidden = false;
        return;
      }
      // A separate, non-persisting client — signing this new person up must never touch
      // your own logged-in session on this page.
      const signupClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: false, autoRefreshToken: false }
      });
      const { data, error } = await signupClient.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + "/index.html" } });
      if(error){ errBox.textContent = error.message; errBox.hidden = false; return; }
      // Supabase answers an email that already has an account with a stand-in user (no identities) instead of an error.
      if(data && data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0){
        errBox.textContent = `${email} already has a login. Find it in the list below and change its role there.`; errBox.hidden = false; return;
      }
      const newId = data && data.user ? data.user.id : null;
      if(newId){
        // New signups default to "pending" (no access) until someone sets a real role —
        // always patch it here, even to "admin", so a login made through this form is
        // never left stuck pending.
        const patch = { role, teacher_name: teacherName || null };
        // The trigger that creates their profile row runs the instant signUp() is called
        // (before they've even confirmed their email), so this update is safe right away.
        // Checked, with a couple of retries (the profile row can take a moment to appear).
        let roleSet = false;
        for(let attempt = 0; attempt < 3 && !roleSet; attempt++){
          if(attempt) await new Promise(r => setTimeout(r, 1200));
          const { data: upd, error: upErr } = await sbClient.from("profiles").update(patch).eq("id", newId).select("id");
          if(upErr) console.warn(upErr);
          roleSet = !upErr && upd && upd.length > 0;
        }
        if(role === "teacher" || role === "trainer_teacher") await ensureTrainer(teacherName, role);
        logHistory("create_login", `Created a login for ${email} (${role}${teacherName ? " — " + teacherName : ""})${roleSet ? "" : " — role NOT set"}`, "profile", newId);
        closeModal();
        [profiles, trainers] = await Promise.all([loadProfiles(), loadTrainers()]);
        renderAdmin();
        if(!roleSet){
          alert(`The login for ${email} was created, but their role${teacherName ? " and teacher name" : ""} couldn't be saved — they'd be stuck on "Pending approval".\n\nFind ${email} in the list and set the role${teacherName ? " and name" : ""} there.`);
          return;
        }
      }else{
        closeModal();
        [profiles, trainers] = await Promise.all([loadProfiles(), loadTrainers()]);
        renderAdmin();
      }
      alert(`Login created for ${email}. Tell them their password yourself.\n\nIf Supabase sends them a "confirm your email" message, they need to click that link once before they can log in.`);
    }
  }

  document.addEventListener("click", async (e)=>{
    const rnBtn = e.target.closest && e.target.closest('[data-action="rename-teacher"]');
    if(rnBtn){
      const oldName = ($("#rnOld").value || "").trim(), newName = ($("#rnNew").value || "").trim();
      if(!oldName || !newName){ alert("Type the current name and the new name."); return; }
      if(oldName === newName){ alert("The new name is the same as the current one."); return; }
      if(!confirm(`Rename "${oldName}" to "${newName}" everywhere?\n\nTheir students, schedules, closed months, PTC, login, Staff list, groups and Training slots will all use the new name.`)) return;
      rnBtn.disabled = true; rnBtn.textContent = "Renaming…";
      const r = await renameTeacherEverywhere(oldName, newName);
      rnBtn.disabled = false; rnBtn.textContent = "Rename everywhere";
      if(!r) return;
      [profiles, trainers] = await Promise.all([loadProfiles(), loadTrainers()]);
      await renderAdmin();
      const out = $("#rnResult");
      if(out) out.innerHTML = r.total
        ? `Done — "${esc(oldName)}" is now "${esc(newName)}" (${r.total} changes${(r.changed || []).length ? ": " + r.changed.map(x => esc(String(x.where).split(".")[0].replace(/_/g, " ")) + " " + x.rows).join(", ") : ""}). Everyone sees it after reloading their page.`
        : `Nothing was called "${esc(oldName)}", so nothing changed. Check the spelling (capitals and spaces count).`;
      return;
    }
    const btn = e.target.closest("[data-action]");
    if(!btn) return;
    if(btn.dataset.action === "logout"){ await sbClient.auth.signOut(); }
    else if(btn.dataset.action === "open-new-login"){ openNewLoginModal(); }
    else if(btn.dataset.action === "close-modal"){ closeModal(); }
    else if(btn.dataset.action === "remove-access" || btn.dataset.action === "restore-access"){
      const id = btn.dataset.id, removing = btn.dataset.action === "remove-access";
      const prof = profiles.find(p => p.id === id) || {};
      const who = prof.email || "this login";
      const msg = removing
        ? `Remove ${who}'s access?\n\nThey'll be signed out and won't be able to log in to Kumon Hub. Their teacher name is cleared, so they no longer see any students. Their students, payments and history stay as they are.\n\nYou can restore the login later.`
        : `Restore ${who}?\n\nThey'll be able to sign in again, as "Pending approval" with no name — set their role and name afterwards.`;
      if(!confirm(msg)) return;
      btn.disabled = true;
      const { error } = await sbClient.rpc(removing ? "remove_login_access" : "restore_login_access", { p_user: id });
      if(error){ btn.disabled = false; alert((removing ? "Couldn't remove access: " : "Couldn't restore access: ") + error.message + (/function/i.test(error.message) ? "\n\nRun phase87-remove-login-access.sql in Supabase first." : "")); return; }
      logHistory(removing ? "remove_access" : "restore_access", `${removing ? "Removed" : "Restored"} ${who}'s access`, "profile", id);
      profiles = await loadProfiles();
      renderAdmin();
    }
  });

  document.addEventListener("change", async (e)=>{
    if(e.target.dataset && e.target.dataset.action === "new-login-role"){
      const box = $("#newLoginTeacherField");
      const isTeach = e.target.value === "teacher" || e.target.value === "trainer_teacher";
      const hint = $("#newLoginTeacherHint");
      if(hint) hint.textContent = isTeach
        ? "Not on the list yet? Just type their name — it'll be added to Staff (Pipeline → Settings) automatically."
        : "Optional. Just their name for the team list — it isn't added to Staff and doesn't change their access.";
      if(box) box.hidden = false;
    }
    if(e.target.dataset && e.target.dataset.action === "change-role"){
      const id = e.target.dataset.id;
      const role = e.target.value;
      const oldRole = (profiles.find(p=>p.id===id)||{}).role || "";
      const wasSuperadmin = oldRole === "superadmin";
      const isSelf = id === currentUser.id && wasSuperadmin && role !== "superadmin";
      if(isSelf && !confirm("This removes your own superadmin access. Continue?")) {
        e.target.value = "superadmin";
        return;
      }
      const { data: upd, error } = await sbClient.from("profiles").update({ role }).eq("id", id).select("id");
      if(error || !upd || !upd.length){
        e.target.value = oldRole;   // show the role it really still has
        alert("Couldn't update that role" + (error ? ": " + error.message : " — the database didn't allow it") + ". It's still " + (oldRole || "unchanged") + ".");
        return;
      }
      const changedProfile = profiles.find(p => p.id === id);
      // Now a teacher (or trainer-teacher): make sure their name is on the Staff list, like a new login would.
      if((role === "teacher" || role === "trainer_teacher") && changedProfile && changedProfile.teacher_name){
        await ensureTrainer(changedProfile.teacher_name, role);
        trainers = await loadTrainers();
      }
      logHistory("change_role", `Changed ${changedProfile ? changedProfile.email : "a login"}'s role to ${role}`, "profile", id, { field:"role", to: role });
      if(isSelf) await loadRole();
      profiles = await loadProfiles();
      renderAdmin();
    }
    if(e.target.dataset && e.target.dataset.action === "change-teacher-name"){
      const id = e.target.dataset.id;
      const teacher_name = e.target.value.trim() || null;
      const before = (profiles.find(p => p.id === id) || {}).teacher_name || "";
      // Changing a teacher's name on a login: rename it everywhere, so their students keep following them
      if(before && teacher_name && before !== teacher_name && currentRole === "superadmin"
         && confirm(`Rename "${before}" to "${teacher_name}" everywhere?\n\nOK = their students, schedules, groups and everything else move to the new name (recommended).\nCancel = only this login changes, and it will no longer match their students.`)){
        const r = await renameTeacherEverywhere(before, teacher_name);
        if(r){ [profiles, trainers] = await Promise.all([loadProfiles(), loadTrainers()]); await renderAdmin(); return; }
        e.target.value = before; return;
      }
      const { error } = await sbClient.from("profiles").update({ teacher_name }).eq("id", id);
      if(error){ alert("Couldn't save that: " + error.message); return; }
      const renamedProfile = profiles.find(p => p.id === id);
      logHistory("change_teacher_name", `Set ${renamedProfile ? renamedProfile.email : "a login"}'s teacher name to ${teacher_name || "(none)"}`, "profile", id);
      if(teacher_name && renamedProfile && (renamedProfile.role === "teacher" || renamedProfile.role === "trainer_teacher")) await ensureTrainer(teacher_name, renamedProfile.role);
      [profiles, trainers] = await Promise.all([loadProfiles(), loadTrainers()]);
      const sharedTrainerList = $("#trainerNamesListInline");
      if(sharedTrainerList) sharedTrainerList.innerHTML = trainers.map(t=>`<option value="${esc(t)}">`).join("");
    }
  });

  boot();
})();
</script>

<!-- Apple-style date picker (same block on every page; delete it to go back to the browser's own) -->
<script>
/* =====================================================================
   Kumon Hub date picker — an Apple-style calendar for every date box.
   Linked right after hub-theme.css on each page. It works on every
   <input type="date">, including ones the page draws later:
   - computers (mouse/trackpad): clicking the box opens this calendar;
   - phones and tablets: the phone's own wheel picker is kept (already Apple-like);
   - typing a date with the keyboard still works as before.
   The input keeps its normal YYYY-MM-DD value and fires the usual
   "input" and "change" events, so no page code had to change.
   Remove the <script> line to go back to the browser's own picker.
   ===================================================================== */
(function(){
  if(window.__hubDatePicker) return; window.__hubDatePicker = true;
  const fine = () => window.matchMedia && window.matchMedia("(pointer: fine)").matches;
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DOW = ["Su","Mo","Tu","We","Th","Fr","Sa"];
  const pad = n => String(n).padStart(2, "0");
  const isoOf = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
  const todayIso = () => { const t = new Date(); return isoOf(t.getFullYear(), t.getMonth(), t.getDate()); };
  const valid = v => /^\d{4}-\d{2}-\d{2}$/.test(v || "");

  const css = `
  input[type="date"]::-webkit-calendar-picker-indicator{ opacity:.55; cursor:pointer; }
  @media (pointer: fine){ input[type="date"]{ cursor:pointer; } }
  .hdp{ position:fixed; z-index:10000; width:288px; padding:14px; border-radius:18px;
    background:var(--glass, rgba(255,255,255,.86)); -webkit-backdrop-filter:saturate(180%) blur(22px); backdrop-filter:saturate(180%) blur(22px);
    border:1px solid var(--border, #E4E4EA); box-shadow:var(--shadow-modal, 0 30px 80px -20px rgba(20,22,30,.4));
    font-family:Inter, -apple-system, system-ui, sans-serif; color:var(--ink, #1D1D1F); font-variant-numeric:tabular-nums;
    transform-origin:top left; animation:hdpIn .16s var(--spring, cubic-bezier(.2,.8,.2,1)); }
  @keyframes hdpIn{ from{ opacity:0; transform:scale(.96) translateY(-4px); } to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){ .hdp{ animation:none; } }
  .hdp-head{ display:flex; align-items:center; gap:4px; margin-bottom:8px; }
  .hdp-title{ flex:1; display:flex; align-items:center; gap:6px; border:0; background:none; padding:6px 8px; margin-left:-6px; border-radius:10px;
    font:inherit; font-size:15px; font-weight:700; color:var(--ink, #1D1D1F); cursor:pointer; text-align:left; }
  .hdp-title:hover{ background:var(--surface-2, #F7F7FA); }
  .hdp-title svg{ width:12px; height:12px; color:var(--accent, #3454D1); transition:transform .2s; }
  .hdp-title[aria-expanded="true"] svg{ transform:rotate(90deg); }
  .hdp-nav{ width:32px; height:32px; border:0; border-radius:50%; background:none; color:var(--accent, #3454D1); cursor:pointer; display:grid; place-items:center; }
  .hdp-nav:hover{ background:var(--accent-soft, #EBEFFD); }
  .hdp-nav:disabled{ opacity:.3; cursor:default; background:none; }
  .hdp-nav svg{ width:16px; height:16px; }
  .hdp-grid{ display:grid; grid-template-columns:repeat(7, 1fr); gap:2px; }
  .hdp-dow{ font-size:11px; font-weight:600; color:var(--ink-faint, #9496A0); text-align:center; padding:4px 0 6px; }
  .hdp-day{ height:34px; border:0; border-radius:50%; background:none; font:inherit; font-size:14px; color:var(--ink, #1D1D1F); cursor:pointer; }
  .hdp-day:hover{ background:var(--surface-2, #F2F2F6); }
  .hdp-day.out{ color:var(--ink-faint, #9496A0); opacity:.55; }
  .hdp-day.today{ color:var(--accent, #3454D1); font-weight:700; }
  .hdp-day.sel{ background:var(--accent, #3454D1); color:var(--accent-ink, #fff); font-weight:700; }
  .hdp-day:disabled{ opacity:.25; cursor:default; background:none; }
  .hdp-day:focus-visible, .hdp-cell:focus-visible, .hdp-nav:focus-visible, .hdp-title:focus-visible, .hdp-foot button:focus-visible{ outline:none; box-shadow:var(--ring, 0 0 0 4px rgba(52,84,209,.18)); }
  .hdp-ym{ display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
  .hdp-years{ display:flex; gap:6px; overflow-x:auto; padding:2px 2px 10px; margin-bottom:6px; border-bottom:1px solid var(--border, #E4E4EA); scrollbar-width:none; }
  .hdp-years::-webkit-scrollbar{ display:none; }
  .hdp-cell{ border:0; border-radius:10px; background:none; padding:10px 0; font:inherit; font-size:14px; font-weight:600; color:var(--ink, #1D1D1F); cursor:pointer; }
  .hdp-years .hdp-cell{ flex:none; padding:7px 12px; border-radius:99px; background:var(--surface-2, #F2F2F6); }
  .hdp-cell:hover{ background:var(--accent-soft, #EBEFFD); }
  .hdp-cell.sel{ background:var(--accent, #3454D1); color:var(--accent-ink, #fff); }
  .hdp-cell:disabled{ opacity:.3; cursor:default; background:none; }
  .hdp-foot{ display:flex; justify-content:space-between; margin-top:10px; padding-top:10px; border-top:1px solid var(--border, #E4E4EA); }
  .hdp-foot button{ border:0; background:none; font:inherit; font-size:14px; font-weight:600; color:var(--accent, #3454D1); cursor:pointer; padding:4px 6px; border-radius:8px; }
  .hdp-foot button:hover{ background:var(--accent-soft, #EBEFFD); }
  .hdp-foot button.muted{ color:var(--ink-muted, #5F6068); }
  .hdp-foot button:disabled{ opacity:.3; cursor:default; background:none; }`;
  const st = document.createElement("style"); st.textContent = css; (document.head || document.documentElement).appendChild(st);

  const chev = d => `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
  let pop = null, input = null, viewY = 0, viewM = 0, mode = "days";

  function bounds(){ return { min: valid(input.min) ? input.min : null, max: valid(input.max) ? input.max : null }; }
  function allowed(iso){ const b = bounds(); return !(b.min && iso < b.min) && !(b.max && iso > b.max); }

  function render(){
    const sel = valid(input.value) ? input.value : null, today = todayIso(), b = bounds();
    let body;
    if(mode === "days"){
      const first = new Date(viewY, viewM, 1).getDay(), dim = new Date(viewY, viewM + 1, 0).getDate(), prevDim = new Date(viewY, viewM, 0).getDate();
      const cells = [];
      for(let i = first - 1; i >= 0; i--){ const d = prevDim - i, m = viewM - 1; const dt = new Date(viewY, m, d); cells.push({ iso: isoOf(dt.getFullYear(), dt.getMonth(), dt.getDate()), d, out: true }); }
      for(let d = 1; d <= dim; d++) cells.push({ iso: isoOf(viewY, viewM, d), d });
      while(cells.length % 7 || cells.length < 42){ const k = cells.length - first - dim + 1; const dt = new Date(viewY, viewM + 1, k); cells.push({ iso: isoOf(dt.getFullYear(), dt.getMonth(), dt.getDate()), d: k, out: true }); if(cells.length >= 42) break; }
      body = `<div class="hdp-grid">${DOW.map(x => `<div class="hdp-dow">${x}</div>`).join("")}${cells.map(c =>
        `<button type="button" class="hdp-day${c.out ? " out" : ""}${c.iso === today ? " today" : ""}${c.iso === sel ? " sel" : ""}" data-iso="${c.iso}"${allowed(c.iso) ? "" : " disabled"} aria-label="${c.iso}">${c.d}</button>`).join("")}</div>`;
    } else {
      const minY = b.min ? +b.min.slice(0, 4) : new Date().getFullYear() - 15, maxY = b.max ? +b.max.slice(0, 4) : new Date().getFullYear() + 5;
      const years = []; for(let y = minY; y <= maxY; y++) years.push(y);
      body = `<div class="hdp-years">${years.map(y => `<button type="button" class="hdp-cell${y === viewY ? " sel" : ""}" data-y="${y}">${y}</button>`).join("")}</div>
        <div class="hdp-ym">${MONTHS.map((m, i) => { const lo = isoOf(viewY, i, 1), hi = isoOf(viewY, i, new Date(viewY, i + 1, 0).getDate());
          const ok = !(b.max && lo > b.max) && !(b.min && hi < b.min);
          return `<button type="button" class="hdp-cell${i === viewM ? " sel" : ""}" data-m="${i}"${ok ? "" : " disabled"}>${m.slice(0, 3)}</button>`; }).join("")}</div>`;
    }
    const prevOk = !b.min || isoOf(viewY, viewM, 1) > b.min, nextOk = !b.max || (viewM === 11 ? isoOf(viewY + 1, 0, 1) : isoOf(viewY, viewM + 1, 1)) <= b.max;
    pop.innerHTML = `<div class="hdp-head">
        <button type="button" class="hdp-title" data-act="mode" aria-expanded="${mode !== "days"}">${MONTHS[viewM]} ${viewY} ${chev("M6 3l5 5-5 5")}</button>
        ${mode === "days" ? `<button type="button" class="hdp-nav" data-act="prev" aria-label="Previous month"${prevOk ? "" : " disabled"}>${chev("M10 3L5 8l5 5")}</button>
        <button type="button" class="hdp-nav" data-act="next" aria-label="Next month"${nextOk ? "" : " disabled"}>${chev("M6 3l5 5-5 5")}</button>` : ""}
      </div>${body}
      <div class="hdp-foot"><button type="button" class="muted" data-act="clear"${input.required ? " disabled" : ""}>Clear</button><button type="button" data-act="today"${allowed(todayIso()) ? "" : " disabled"}>Today</button></div>`;
    if(mode !== "days"){ const s = pop.querySelector(".hdp-years .sel"); if(s) s.scrollIntoView({ block: "nearest", inline: "center" }); }
  }
  function place(){
    const r = input.getBoundingClientRect(), w = 288, h = pop.offsetHeight || 360;
    let left = Math.min(Math.max(8, r.left), window.innerWidth - w - 8);
    let top = r.bottom + 6; if(top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
    pop.style.left = left + "px"; pop.style.top = top + "px";
  }
  function setValue(iso){
    const old = input.value; input.value = iso;
    if(old !== iso){ input.dispatchEvent(new Event("input", { bubbles: true })); input.dispatchEvent(new Event("change", { bubbles: true })); }
  }
  function close(){ if(pop){ pop.remove(); pop = null; } if(input){ const i = input; input = null; try{ i.focus({ preventScroll: true }); }catch(_){ } } }
  function open(el){
    if(pop) close();
    input = el; mode = "days";
    const base = valid(el.value) ? el.value : (valid(el.max) && el.max < todayIso() ? el.max : valid(el.min) && el.min > todayIso() ? el.min : todayIso());
    viewY = +base.slice(0, 4); viewM = +base.slice(5, 7) - 1;
    pop = document.createElement("div"); pop.className = "hdp"; pop.setAttribute("role", "dialog"); pop.setAttribute("aria-label", "Choose a date");
    document.body.appendChild(pop); render(); place();
    const f = pop.querySelector(".hdp-day.sel") || pop.querySelector(".hdp-day.today") || pop.querySelector(".hdp-day:not(:disabled)"); if(f) f.focus({ preventScroll: true });
  }

  document.addEventListener("mousedown", e => {
    const el = e.target.closest && e.target.closest('input[type="date"]');
    if(pop && !pop.contains(e.target) && el !== input) close();
    if(!el || el.disabled || el.readOnly || !fine()) return;
    e.preventDefault();               // stop the browser's own picker
    if(pop && el === input){ close(); return; }
    open(el);
  }, true);
  document.addEventListener("click", e => {
    if(!pop || !pop.contains(e.target)) return;
    const b = e.target.closest("button"); if(!b || b.disabled) return;
    const act = b.dataset.act;
    if(b.dataset.iso){ setValue(b.dataset.iso); close(); return; }
    if(b.dataset.y){ viewY = +b.dataset.y; render(); return; }
    if(b.dataset.m){ viewM = +b.dataset.m; mode = "days"; render(); return; }
    if(act === "mode"){ mode = mode === "days" ? "months" : "days"; render(); return; }
    if(act === "prev"){ if(--viewM < 0){ viewM = 11; viewY--; } render(); return; }
    if(act === "next"){ if(++viewM > 11){ viewM = 0; viewY++; } render(); return; }
    if(act === "today"){ setValue(todayIso()); close(); return; }
    if(act === "clear"){ setValue(""); close(); return; }
  });
  document.addEventListener("keydown", e => {
    if(!pop) return;
    if(e.key === "Escape"){ e.preventDefault(); close(); return; }
    const a = document.activeElement;
    if(a && a.classList && a.classList.contains("hdp-day") && /^Arrow/.test(e.key)){
      e.preventDefault();
      const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[e.key];
      const d = new Date(a.dataset.iso + "T00:00:00"); d.setDate(d.getDate() + step);
      const iso = isoOf(d.getFullYear(), d.getMonth(), d.getDate());
      if(d.getMonth() !== viewM || d.getFullYear() !== viewY){ viewY = d.getFullYear(); viewM = d.getMonth(); render(); }
      const n = pop.querySelector(`.hdp-day[data-iso="${iso}"]:not(.out)`) || pop.querySelector(`.hdp-day[data-iso="${iso}"]`); if(n) n.focus();
    }
  });
  window.addEventListener("resize", () => { if(pop) place(); });
  document.addEventListener("scroll", e => { if(pop && !pop.contains(e.target)) place(); }, true);
})();

</script>
</body>
