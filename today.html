<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kumon Hub — Today</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#F5F6FA; --surface:#FFFFFF; --surface-2:#FBFBFE; --border:#E1E4EB;
    --ink:#1B1F27; --ink-muted:#636C7C; --ink-faint:#9AA1AF;
    --accent:#3454D1; --accent-ink:#FFFFFF; --accent-soft:#E9EDFC; --accent-soft-ink:#2A41A8;
    --good:#1E8E5A; --good-soft:#E4F5EC; --warn:#C2831F; --warn-soft:#FBF0E1; --bad:#C23B2B; --bad-soft:#FBE8E5;
    --shadow: 0 1px 2px rgba(16,20,30,.04), 0 2px 8px rgba(16,20,30,.06), 0 20px 40px -20px rgba(16,20,30,.25);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14161C; --surface:#1C1F27; --surface-2:#20232C; --border:#2C303B;
      --ink:#EDEFF4; --ink-muted:#9BA3B2; --ink-faint:#6B7280;
      --accent:#6C86F0; --accent-ink:#0E1220; --accent-soft:#232A47; --accent-soft-ink:#B7C3FA;
      --good:#4FC48A; --good-soft:#173226; --warn:#E0A23F; --warn-soft:#332711; --bad:#F0796A; --bad-soft:#3A1F1C;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161C; --surface:#1C1F27; --surface-2:#20232C; --border:#2C303B;
    --ink:#EDEFF4; --ink-muted:#9BA3B2; --ink-faint:#6B7280;
    --accent:#6C86F0; --accent-ink:#0E1220; --accent-soft:#232A47; --accent-soft-ink:#B7C3FA;
    --good:#4FC48A; --good-soft:#173226; --warn:#E0A23F; --warn-soft:#332711; --bad:#F0796A; --bad-soft:#3A1F1C;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--ink); margin:0;
    font-family:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.brand{ font-family:"Sora", system-ui, sans-serif; }
  h1,h2,h3{ text-wrap:balance; margin:0; }
  button{ font-family:inherit; }
  a{ color:var(--accent); }

  .app{ display:grid; grid-template-columns: 216px 1fr; min-height:100vh; min-height:100dvh; }
  .rail{
    background:var(--surface); border-right:1px solid var(--border);
    padding:20px 12px; display:flex; flex-direction:column; gap:4px;
    position:sticky; top:0; align-self:start; height:100vh; height:100dvh;
  }
  .brand{ font-weight:700; font-size:16px; padding:6px 10px 18px; display:flex; align-items:center; gap:8px; color:var(--ink); }
  .brand .dot{ width:9px;height:9px;border-radius:50%;background:var(--accent); flex:none; }
  .navbtn{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px;
    border:none; background:transparent; color:var(--ink-muted); font-size:14px; font-weight:600;
    cursor:pointer; text-align:left; width:100%; text-decoration:none;
    transition: background-color .15s ease, color .15s ease, box-shadow .15s ease;
  }
  .navbtn:focus-visible{ outline:none; box-shadow: 0 0 0 3px var(--accent-soft); }
  .navbtn:hover{ background:var(--surface-2); color:var(--ink); }
  .navbtn svg{ width:17px; height:17px; flex:none; }
  .navbtn.active{ background:var(--accent-soft); color:var(--accent-soft-ink); box-shadow: inset 3px 0 0 var(--accent); }
  .rail-pages{ display:flex; flex-direction:column; gap:4px; margin-bottom:8px; }
  .rail-divider{ height:1px; background:var(--border); margin:4px 10px 10px; }
  .rail-account{ padding:0 10px 10px; }
  .account-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 8px; border-top:1px solid var(--border); font-size:12px; color:var(--ink-muted); }
  .account-email{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rail-foot{ margin-top:auto; padding:10px; font-size:12px; color:var(--ink-faint); line-height:1.5; }

  .main{ padding:26px 30px 60px; max-width:1100px; width:100%; min-width:0; }
  .page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
  .page-head h1{ font-size:22px; font-weight:700; }
  .page-sub{ color:var(--ink-muted); font-size:13.5px; margin-top:4px; }

  .btn{
    display:inline-flex; align-items:center; gap:7px; padding:9px 14px; border-radius:9px;
    font-size:13.5px; font-weight:600; border:1px solid var(--border); background:var(--surface);
    color:var(--ink); cursor:pointer; white-space:nowrap;
    transition: background-color .15s ease, border-color .15s ease, color .15s ease, box-shadow .15s ease, transform .08s ease;
  }
  .btn:hover{ background:var(--surface-2); }
  .btn:active{ transform:scale(.96); }
  .btn:focus-visible{ outline:none; box-shadow: 0 0 0 3px var(--accent-soft); }
  .btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .btn.good{ color:var(--good); border-color:var(--good-soft); }
  .btn.good:hover{ background:var(--good-soft); }
  .btn.ghost{ border-color:transparent; background:transparent; }
  .btn.sm{ padding:6px 10px; font-size:12.5px; border-radius:7px; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; margin-bottom:18px; }
  .card-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--border); gap:10px; flex-wrap:wrap; }
  .card-head h3{ font-size:14.5px; font-weight:700; }
  .empty{ padding:30px 16px; text-align:center; color:var(--ink-muted); font-size:13.5px; }

  .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:12px; }
  .stat{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:13px 14px; display:flex; flex-direction:column; gap:6px; }
  .stat .n{ font-size:22px; font-weight:700; font-family:"Sora",sans-serif; }
  .stat .l{ font-size:12px; color:var(--ink-muted); font-weight:600; }
  .stat.warn .n{ color:var(--warn); }
  .stat.bad .n{ color:var(--bad); }
  button.stat{ cursor:pointer; text-align:left; font:inherit; transition: border-color .15s ease, box-shadow .15s ease, background-color .15s ease; }
  button.stat:hover{ border-color:var(--accent); }
  button.stat.selected{ border-color:var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); background:var(--accent-soft); }
  button.stat.selected .l{ color:var(--accent-soft-ink); }
  .filter-note{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-muted); margin:-6px 0 12px; }
  .filter-note button{ border:none; background:transparent; color:var(--accent); font-weight:600; cursor:pointer; padding:0; font-size:12.5px; }

  .cal-toolbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:10px; }
  .cal-nav{ display:flex; align-items:center; gap:8px; }
  .cal-nav h2{ font-size:16px; font-weight:700; min-width:160px; text-align:center; }
  .month-head{ display:flex; flex-direction:column; align-items:center; }
  .month-head h2{ margin:0; }
  .month-range{ font-size:11px; color:var(--ink-muted); margin-top:1px; }
  @media (max-width: 640px){ .cal-nav h2{ font-size:14px; min-width:0; flex:1; } }

  .seg{ display:inline-flex; background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:2px; }
  .seg button{ border:none; background:transparent; padding:6px 11px; border-radius:7px; font-size:12.5px; font-weight:600; color:var(--ink-muted); cursor:pointer; }
  .seg button:active{ transform:scale(.94); }
  .seg button.active{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }

  .search-row{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
  .search-row input, .search-row select{ font-size:13.5px; width:auto; flex:0 0 auto; }
  .search-row select{ min-width:132px; }
  .table-scroll{ overflow-x:auto; }
  .stable{ min-width:100%; width:auto; border-collapse:collapse; }
  .stable th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-muted); padding:8px 16px; border-bottom:1px solid var(--border); white-space:nowrap; }
  .stable td{ padding:10px 16px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle; white-space:nowrap; }
  .stable .empty{ white-space:normal; }
  .stable tr:last-child td{ border-bottom:none; }
  .stable tbody tr td{ transition: background-color .12s ease; }
  .stable tbody tr:hover td{ background:var(--surface-2); }
  .stable tr.clickrow{ cursor:pointer; }
  .stable tr.clickrow:hover{ background:var(--surface-2); }
  .muted{ color:var(--ink-muted); }
  .hint{ font-size:12px; color:var(--ink-muted); font-weight:500; }
  .faint{ color:var(--ink-faint); }
  .money{ font-variant-numeric:tabular-nums; font-weight:600; }
  .money.good{ color:var(--good); }
  .pill{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:700; white-space:nowrap; transition: background-color .15s ease, color .15s ease; }
  .pill.subj-math{ background:var(--accent-soft); color:var(--accent-soft-ink); }
  .pill.subj-reading{ background:var(--bad-soft); color:var(--bad); }
  .pill.m1, .pill.m2{ background:var(--warn-soft); color:var(--warn); }
  .pill.m3, .pill.m4{ background:var(--bad-soft); color:var(--bad); }
  .pill.resumed{ background:var(--good-soft); color:var(--good); }
  .pill.pending{ background:var(--accent-soft); color:var(--accent-soft-ink); }
  .pill.flagged{ background:var(--warn-soft); color:var(--warn); }
  .pill.verified{ background:var(--good-soft); color:var(--good); }
  .pill.rejected{ background:var(--surface-2); color:var(--ink-faint); }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .lvl.empty-lvl{ color:var(--ink-faint); }
  .pill.beyond{ background:var(--surface-2); color:var(--ink-faint); }
  .name-subj-pill{ margin-left:6px; vertical-align:middle; padding:2px 7px; }
  .row-actions{ display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }

  select, input[type=text], input[type=search], textarea{
    font-family:inherit; font-size:13.5px; padding:8px 10px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); width:100%;
  }
  select, input, textarea{ transition: border-color .15s ease, box-shadow .15s ease; }
  select:focus, input:focus, textarea:focus{ outline:none; border-color:var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  label.field{ display:flex; flex-direction:column; gap:5px; font-size:12.5px; font-weight:600; color:var(--ink-muted); }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(10,12,18,.5); display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; overflow-y:auto; z-index:50; }
  .modal{ background:var(--surface); border-radius:16px; width:100%; max-width:460px; box-shadow:var(--shadow); }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--border); }
  .modal-head h3{ font-size:15.5px; font-weight:700; }
  .modal-body{ padding:16px 18px; display:flex; flex-direction:column; gap:12px; max-height:66vh; overflow-y:auto; }
  .modal-foot{ display:flex; justify-content:flex-end; gap:8px; padding:14px 18px; border-top:1px solid var(--border); }
  .iconbtn{ border:none; background:transparent; cursor:pointer; color:var(--ink-muted); padding:4px; border-radius:6px; transition: background-color .15s ease, color .15s ease, transform .08s ease; }
  .iconbtn:hover{ background:var(--surface-2); color:var(--ink); }
  .iconbtn:active{ transform:scale(.9); }

  .note-item{ border:1px solid var(--border); border-radius:10px; padding:10px 12px; background:var(--surface-2); }
  .note-item .note-meta{ font-size:11px; color:var(--ink-muted); margin-bottom:4px; }
  .note-item .note-text{ font-size:13px; white-space:pre-wrap; }
  .note-form{ display:flex; flex-direction:column; gap:8px; }

  .banner{ background:var(--warn-soft); color:var(--warn); border-radius:11px; padding:11px 14px; font-size:13px; font-weight:600; margin-bottom:16px; }
  .banner.info{ background:var(--accent-soft); color:var(--accent-soft-ink); }

  .toast{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--ink); color:var(--bg); font-size:13px; font-weight:600; padding:10px 16px; border-radius:10px; z-index:95; box-shadow:var(--shadow); }

  .login-screen{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg); z-index:100; padding:20px; }
  .login-card{ width:100%; max-width:360px; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:28px 26px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:14px; }
  .login-brand{ font-family:"Sora", system-ui, sans-serif; font-weight:700; font-size:18px; display:flex; align-items:center; gap:8px; color:var(--ink); }
  .login-brand .dot{ width:9px; height:9px; border-radius:50%; background:var(--accent); flex:none; }
  .login-sub{ font-size:13px; color:var(--ink-muted); margin:-6px 0 4px; }
  .login-error{ background:var(--bad-soft); color:var(--bad); border-radius:9px; padding:9px 12px; font-size:12.5px; font-weight:600; }

  [hidden]{ display:none !important; }

  @media (max-width: 860px){
    .app{ grid-template-columns:1fr; }
    .rail{ position:fixed; bottom:0; left:0; right:0; top:auto; height:auto; flex-direction:row; padding:8px; border-right:none; border-top:1px solid var(--border); z-index:40; }
    .brand, .rail-foot, .rail-account{ display:none; }
    .rail-pages{ flex-direction:row; flex:1; margin-bottom:0; }
    .rail-divider{ display:none; }
    .navbtn{ text-align:center; justify-content:center; }
    .main{ padding:16px 14px calc(70px + env(safe-area-inset-bottom)); }
    .stats{ grid-template-columns:repeat(2,1fr); }
    .stable th, .stable td{ padding:9px 8px; font-size:12.5px; }
    .modal-backdrop{ padding:0; align-items:flex-end; }
    .modal{ max-width:none; border-radius:16px 16px 0 0; max-height:92vh; }
    .field-row{ grid-template-columns:1fr; }
  }

  /* ===== Shared across pages: collapsible sidebar + fit-to-screen ===== */
  :root{ --rail-w:216px; --z:1; }
  html.rail-collapsed{ --rail-w:68px; }
  .rail-toggle{ display:none; }
  .rail-pipeline .rail-section-label{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); padding:2px 10px 6px; }
  .rail-pipeline{ display:flex; flex-direction:column; gap:4px; margin-bottom:8px; }
  @media (min-width:1600px){ :root{ --z:1.1; } }
  @media (min-width:1900px){ :root{ --z:1.2; } }
  @media (min-width:2300px){ :root{ --z:1.4; } }
  @media (min-width:2800px){ :root{ --z:1.7; } }
  @media (min-width:3400px){ :root{ --z:2; } }
  @media (min-width:861px){
    /* Big screens: the page fills the window and everything scales up together (steps above), instead of
       sitting in a narrow column with tiny text and empty space on the right. */
    body{ zoom:var(--z); }
    .app{ grid-template-columns:var(--rail-w) minmax(0,1fr); min-height:calc(100dvh / var(--z)); transition:grid-template-columns .18s ease; }
    .rail{ height:calc(100dvh / var(--z)); overflow-y:auto; overflow-x:hidden; }
    .main{ max-width:none; }
    .rail-pipeline-mobile{ display:none !important; }
    .rail-toggle{ display:inline-flex; position:absolute; top:20px; right:10px; width:28px; height:28px; align-items:center; justify-content:center; border:1px solid var(--border); background:var(--surface); color:var(--ink-muted); border-radius:8px; cursor:pointer; padding:0; }
    .rail-toggle:hover{ background:var(--surface-2); color:var(--ink); }
    .rail-toggle svg{ width:15px; height:15px; transition:transform .18s ease; }
    html.rail-collapsed .rail-toggle svg{ transform:rotate(180deg); }
    html.rail-collapsed .rail{ padding:20px 8px; }
    html.rail-collapsed .rail-toggle{ position:static; align-self:center; margin-bottom:12px; }
    html.rail-collapsed .brand{ display:none; }
    html.rail-collapsed .navbtn{ font-size:0; justify-content:center; padding:10px 0; position:relative; gap:0; }
    html.rail-collapsed .navbtn svg{ width:19px; height:19px; }
    html.rail-collapsed .navbtn .badge{ position:absolute; top:3px; right:8px; font-size:10px; margin:0; padding:0 4px; min-width:15px; line-height:15px; }
    html.rail-collapsed .rail-section-label, html.rail-collapsed .rail-account, html.rail-collapsed .rail-foot{ display:none; }
    html.rail-collapsed .rail-divider{ margin:6px 8px; }
  }
  @media (max-width:860px){ .rail-pipeline{ display:none !important; } }






  /* ===== Today page ===== */
  #pageHead{ display:block; margin-bottom:0; }
  .td-top{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .td-date{ font-size:13px; color:var(--ink-faint); font-weight:500; }
  .td-who{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-muted); font-weight:600; }
  .td-who select{ width:auto; min-width:170px; }
  .td-mast{ padding:26px 0 28px; border-bottom:1px solid var(--border); margin-bottom:30px; display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:40px; align-items:end; }
  .td-hello{ font-family:"Sora", system-ui, sans-serif; text-wrap:balance; font-size:clamp(32px, 4.6vw, 52px); line-height:1.08; font-weight:700; letter-spacing:-.04em; margin:0; }
  .td-hello span{ color:var(--ink-muted); font-weight:600; }
  .td-lede{ margin:14px 0 0; font-size:16.5px; color:var(--ink-muted); line-height:1.55; max-width:48ch; }
  .td-lede b{ color:var(--ink); font-weight:600; }
  .td-quote{ border-left:2px solid var(--ink); padding:2px 0 2px 18px; margin:0; }
  .td-quote p{ margin:0; font-size:18.5px; line-height:1.5; font-style:italic; font-weight:500; }
  .td-quote cite{ display:block; margin-top:10px; font-style:normal; font-size:12.5px; color:var(--ink-faint); }

  .td-kicker{ font-size:12.5px; font-weight:600; color:var(--accent); margin-bottom:6px; }
  .td-title{ font-family:"Sora", system-ui, sans-serif; font-size:24px; font-weight:700; letter-spacing:-.03em; line-height:1.2; margin:0; }
  .td-dek{ color:var(--ink-muted); font-size:14.5px; margin:6px 0 0; line-height:1.5; max-width:64ch; }
  .td-sec{ margin-bottom:44px; }
  .td-sec-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; }

  .td-day{ display:grid; grid-template-columns:210px minmax(0,1fr); gap:28px; padding:24px; margin-top:16px; }
  .td-ring{ display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; }
  .td-legend{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; font-size:12px; color:var(--ink-muted); }
  .td-legend span{ display:inline-flex; align-items:center; gap:5px; }
  .td-legend i{ width:8px; height:8px; border-radius:50%; }
  .td-tl{ position:relative; height:66px; margin:6px 0 16px; }
  .td-tl-axis{ position:absolute; left:0; right:0; bottom:0; height:18px; font-size:11px; color:var(--ink-faint); }
  .td-tl-axis span{ position:absolute; transform:translateX(-50%); white-space:nowrap; }
  .td-tl-track{ position:absolute; left:0; right:0; top:8px; height:36px; border-radius:10px; background:var(--surface-2); border:1px solid var(--border); }
  .td-tl-block{ position:absolute; top:8px; height:36px; min-width:26px; border-radius:10px; background:var(--accent-soft); color:var(--accent-soft-ink); font-size:11.5px; font-weight:700; display:flex; align-items:center; justify-content:center; border:none; cursor:pointer; font-family:inherit; transition:transform .15s var(--spring, ease); }
  .td-tl-block:active{ transform:scale(.95); }
  .td-tl-block.past{ background:var(--surface-2); color:var(--ink-faint); border:1px solid var(--border); }
  .td-tl-block.on{ outline:2px solid var(--accent); outline-offset:1px; }
  .td-tl-now{ position:absolute; top:0; width:2px; height:52px; background:var(--bad); border-radius:2px; pointer-events:none; }
  .td-tl-now::before{ content:""; position:absolute; top:-3px; left:-3px; width:8px; height:8px; border-radius:50%; background:var(--bad); }

  .td-slot-h{ display:flex; align-items:baseline; gap:10px; margin:2px 0 6px; flex-wrap:wrap; }
  .td-slot-h b{ font-size:15px; } .td-slot-h span{ font-size:12.5px; color:var(--ink-faint); }

<script>
/* PTC menu link + "due" number (phase97). Each page calls kumonPtcNav(sbClient, role) once the role is known. */
window.kumonPtcNav = function(client, role){
  var link = document.getElementById("navPtcLink"); if(!link) return;
  var ok = ["admin","superadmin","teacher","trainer_teacher"].indexOf(role) >= 0;
  link.hidden = !ok;
  var proj = document.getElementById("navProjLink"); if(proj) proj.hidden = !ok;
  // Today (Nov 9): the morning page — added here so every page gets the link, first in the menu.
  var td = document.getElementById("navTodayLink");
  if(!td && ok){
    var tbox = document.querySelector(".rail-pages");
    if(tbox){
      td = document.createElement("a"); td.className = "navbtn"; td.id = "navTodayLink"; td.href = "today.html"; td.title = "Today";
      td.innerHTML = (tbox.querySelector(".navbtn svg") ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>' : "") + 'Today';
      if(/today\.html$/.test(location.pathname)) td.classList.add("active");
      var firstLink = tbox.querySelector(".navbtn:not(.rail-pipeline-mobile)");
      tbox.insertBefore(td, firstLink || tbox.firstChild);
    }
  }
  if(td) td.hidden = !ok;
  // Worksheets (phase118): admins and superadmins only — the link is added here so every page gets it.
  var wsAdm = role === "admin" || role === "superadmin", ws = document.getElementById("navWsLink");
  if(!ws && wsAdm){
    var after = document.getElementById("navReportsLink") || document.getElementById("navActivityLink") || document.getElementById("navAdminLink");
    var box = after ? after.parentNode : document.querySelector(".rail-pages");
    if(box){
      ws = document.createElement("a"); ws.className = "navbtn"; ws.id = "navWsLink"; ws.href = "worksheets.html"; ws.title = "Worksheets";
      ws.innerHTML = (box.querySelector(".navbtn svg") ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10v4H7zM5 7h14v14H5z"/><path d="M9 12h6M9 16h4"/></svg>' : "") + 'Worksheets';   // icon only where the menu has icons
      if(/worksheets\.html$/.test(location.pathname)) ws.classList.add("active");
      if(after && after.nextSibling) box.insertBefore(ws, after.nextSibling); else box.appendChild(ws);
    }
  }
  if(ws) ws.hidden = !wsAdm;
  // Admin tools (Nov 9): on computers, Admin, Activity, Reports and Worksheets sit in their own "Admin" section
  // at the bottom of the menu so teachers' links aren't mixed with them. On phones they stay in the bottom bar.
  if(!window.__kumonAdminGroup){
    window.__kumonAdminGroup = true;
    var ids = ["navReportsLink", "navWsLink", "navAdminLink", "navActivityLink"];   // the order they show in
    var place = function(){
      var pages = document.querySelector(".rail-pages"); if(!pages) return;
      var grp = document.getElementById("navAdminGroup");
      if(!grp){
        grp = document.createElement("div"); grp.className = "rail-admin"; grp.id = "navAdminGroup";
        grp.innerHTML = '<div class="rail-divider"></div><div class="rail-section-label">Admin</div>';
        var acct = document.getElementById("railAccount");
        if(acct && acct.parentNode) acct.parentNode.insertBefore(grp, acct); else pages.parentNode.appendChild(grp);
      }
      var wide = !window.matchMedia || window.matchMedia("(min-width: 861px)").matches;
      ids.forEach(function(id){ var a = document.getElementById(id); if(!a) return; if(wide) grp.appendChild(a); else if(a.parentNode !== pages) pages.appendChild(a); });
      // Settings (from Pipeline views) goes last in the Admin section; same people see it as before (whoever sees Pipeline)
      var st = document.getElementById("navSettingsLink") || document.querySelector('.rail a.navbtn[href="index.html#settings"], .rail button.navbtn[data-tab="settings"]');
      if(st){
        if(!st.id) st.id = "navSettingsLink";
        if(!st.__home){ st.__home = st.parentNode; st.__next = st.nextSibling; }
        var pl = document.getElementById("navPipelineLink");
        if(st.tagName === "A") st.hidden = pl ? pl.hidden : false;
        if(wide){ if(st.parentNode !== grp || grp.lastElementChild !== st) grp.appendChild(st); }
        else if(st.parentNode !== st.__home){ st.__home.insertBefore(st, st.__next && st.__next.parentNode === st.__home ? st.__next : null); }
      }
      var any = ids.concat(["navSettingsLink"]).some(function(id){ var a = document.getElementById(id); return a && !a.hidden && a.parentNode === grp; });
      grp.hidden = !any;
    };
    window.__kumonPlaceAdmin = place;
    if(window.matchMedia){ var mq = window.matchMedia("(min-width: 861px)"); if(mq.addEventListener) mq.addEventListener("change", place); else if(mq.addListener) mq.addListener(place); }
    // pages decide who sees each link a moment after this runs, so look again when that changes
    if(window.MutationObserver){ var mo = new MutationObserver(function(){ place(); }); ids.concat(["navPipelineLink"]).forEach(function(id){ var a = document.getElementById(id); if(a) mo.observe(a, { attributes: true, attributeFilter: ["hidden"] }); }); }
    setTimeout(place, 0); setTimeout(place, 800);
  }
  if(window.__kumonPlaceAdmin) window.__kumonPlaceAdmin();
  if(!ok || !client) return;
  if(!document.getElementById("ptcBadgeStyle")){
    var st = document.createElement("style"); st.id = "ptcBadgeStyle";
    st.textContent = ".navbtn .ptc-badge{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 6px;min-width:18px;text-align:center;line-height:16px;}";
    document.head.appendChild(st);
  }
  // An expired sign-in (a tab left open in the background) is renewed and the count asked again once;
  // with no sign-in at all it doesn't ask. A failed check keeps the last number instead of hiding it.
  var expired = function(r){ var e = r && r.error; return !!e && (e.status === 401 || /jwt|expired|401/i.test(String(e.message || e.code || ""))); };
  var refresh = function(){
    var ask = function(){ return client.rpc("ptc_due_count"); };
    client.auth.getSession().then(function(s){
      if(!s || !s.data || !s.data.session) return null;
      return ask().then(function(r){
        if(!expired(r)) return r;
        return client.auth.refreshSession().then(function(x){ return (x && x.data && x.data.session) ? ask() : null; }, function(){ return null; });
      });
    }).then(function(r){
      var b = document.getElementById("navPtcBadge"); if(!b || !r || r.error || typeof r.data !== "number") return;
      var n = r.data;
      b.textContent = n > 99 ? "99+" : String(n); b.hidden = !n;
      link.title = n ? ("PTC — " + n + " due") : "PTC";
    }, function(){});
  };
  refresh();
  window.kumonPtcNavRefresh = refresh;
  if(!window.__ptcNavTimer) window.__ptcNavTimer = setInterval(refresh, 5 * 60 * 1000);
};
</script>
<script>
/* Sign-in resilience (Oct 23). A slow or dropped connection used to make the page think the account had no role
   ("waiting for approval — ask a superadmin"), and a hiccup while renewing the sign-in could log people out.
   kumonFetchProfile retries, renews the sign-in if it expired, and — only if the Hub still can't be reached —
   uses the last role this account had on this browser instead of "pending". */
(function(){
  var sleep = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };
  function notice(msg){
    var el = document.getElementById("kumonNetNotice");
    if(!msg){ if(el) el.remove(); return; }
    if(!el){
      el = document.createElement("div"); el.id = "kumonNetNotice";
      el.style.cssText = "position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:200;background:#1B1F27;color:#fff;font:600 13px Inter,system-ui,sans-serif;padding:9px 14px;border-radius:10px;box-shadow:0 8px 24px -10px rgba(0,0,0,.4)";
      (document.body || document.documentElement).appendChild(el);
    }
    el.textContent = msg;
  }
  window.kumonFetchProfile = async function(client, uid, cols){
    var key = "kumonProfile:" + uid, cached = null;
    try{ cached = JSON.parse(localStorage.getItem(key) || "null"); }catch(e){}
    var want = String(cols).split(",").map(function(s){ return s.trim(); }).filter(Boolean);
    var cacheOk = cached && cached.role && cached.role !== "pending" && want.every(function(k){ return k in cached; });
    var once = async function(){ try{ return await client.from("profiles").select(cols).eq("id", uid).maybeSingle(); }catch(e){ return { data:null, error:e }; } };
    for(var attempt = 0; ; attempt++){
      var r = await once();
      if(!r.error && !r.data && attempt === 0){
        // An expired sign-in can read as "no profile" instead of an error: renew it and ask once more.
        try{ await client.auth.refreshSession(); }catch(e){}
        r = await once();
      }
      if(!r.error){
        if(r.data){ try{ localStorage.setItem(key, JSON.stringify(Object.assign({}, cached || {}, r.data))); }catch(e){} }
        notice(null);
        return { data: r.data, error: null };
      }
      var msg = String((r.error && (r.error.message || r.error.code)) || "");
      if(/jwt|token|expired|401|auth/i.test(msg)){ try{ await client.auth.refreshSession(); }catch(e){} }
      if(cacheOk && attempt >= 2){ notice(null); return { data: cached, error: null, fromCache: true }; }
      notice("Can't reach the Kumon Hub right now — trying again…");
      await sleep(Math.min(8000, 800 * (attempt + 1)));
    }
  };
  // Before treating a "signed out" event as real, make sure the sign-in is really gone (not a hiccup while renewing it).
  window.kumonStillSignedIn = async function(client, uid){
    if(window.__kumonLoggingOut) return false;
    await sleep(1200);
    try{ var a = await client.auth.getSession(); if(a && a.data && a.data.session && a.data.session.user.id === uid) return true; }catch(e){}
    if(window.__kumonLoggingOut) return false;
    try{ var b = await client.auth.refreshSession(); if(b && b.data && b.data.session && b.data.session.user.id === uid) return true; }catch(e){}
    return false;
  };
  // Mark a deliberate "Log out" click so it isn't second-guessed above; forget the remembered role on log out.
  document.addEventListener("click", function(e){
    var b = e.target && e.target.closest && e.target.closest('[data-action="logout"]');
    if(!b) return;
    window.__kumonLoggingOut = true;
    try{ Object.keys(localStorage).forEach(function(k){ if(k.indexOf("kumonProfile:") === 0) localStorage.removeItem(k); }); }catch(err){}
  }, true);
})();
</script>

  function normGrade(g){
    const t = String(g || "").trim().toUpperCase().replace(/\s+/g, " ");

    let m = t.match(/^(?:GRADE ?|GR\.? ?|G ?)?(\d{1,2})(?:ST|ND|RD|TH)?(?: GRADE)?$/); if(m) return "P" + Number(m[1]);

    return t;
  }
  function normLevel(subject, lv){

    if(!t) return "";
    const al = LEVEL_ALIAS[subject] || {};
    if(al[t]) t = al[t];

  }
  function levelIndex(subject, lv){ return (LADDER[subject] || []).indexOf(normLevel(subject, lv)); }

    $$("#pageHead, #view").forEach(x => { x.style.display = blocked ? "none" : ""; });
  }
  async function loadRole(){

  async function selectAll(table, cols, build){
    let out = [], from = 0;
    for(;;){
      let q = sbClient.from(table).select(cols).range(from, from + 999);
      if(build) q = build(q);
      const { data, error } = await q;
      if(error){ console.warn(table, error); const err = new Error(error.message || "load failed"); err.loadFailed = true; throw err; }
      out = out.concat(data || []);
      if(!data || data.length < 1000) return out;
      from += 1000;
    }
  }

  /* the KIS / award lines for one grade: value (in notches, 20 per level) at a date — same as the Projection page */
  function standardLines(subject, grade, sy){
    const gi = gradeIdx(grade);
    if(!gi) return null;
    if(subject === "Math"){
      const base = 20 * gi;
      const kis = d => base + monthsBetween(sy, d) * 5 / 3;
      return { kis };
    }
    const curve = (key) => {
      let arr = READING_CURVES[key][grade], shift = 0;
      if(!arr){ arr = READING_CURVES[key]["P9"]; shift = 20 * (gi - gradeIdx("P9")); }   // the sheet stops at P9
      return d => {
        const m = monthsBetween(sy, d), n = arr.length - 1;
        if(m <= 0) return arr[0] + (arr[1] - arr[0]) * m + shift;
        if(m >= n) return arr[n] + (arr[n] - arr[n-1]) * (m - n) + shift;
        const k = Math.floor(m); return arr[k] + (arr[k+1] - arr[k]) * (m - k) + shift;
      };
    };
    return { kis: curve("kis") };
  }

  /* ======================= Today: the morning page =======================
     One page a teacher opens first: today's classes (from the Calendar, with this week's moves and arrived ticks),
     what needs them this week (PTC, projections, children behind KIS), this month's scorecard, and where every
     child stands against KIS. Teachers see their own students; admins can pick a teacher or the whole centre.
     Nothing here writes to the database. */
  const DAY_ORDER = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const QUOTES = [
    ["Well begun is half done.", "Aristotle"],
    ["It always seems impossible until it's done.", "Attributed to Nelson Mandela"],
    ["The beautiful thing about learning is that nobody can take it away from you.", "B.B. King"],
    ["Little by little, one travels far.", "Spanish proverb"],
    ["Teaching is the highest form of understanding.", "Attributed to Aristotle"],
    ["The expert in anything was once a beginner.", "Attributed to Helen Hayes"],
    ["A journey of a thousand miles begins with a single step.", "Lao Tzu"],
    ["What we learn with pleasure we never forget.", "Attributed to Alfred Mercier"]
  ];
  const AV_COLORS = ["#3454D1","#D2453A","#24935A","#B9770E","#7B4FD1","#1F8FA8","#C2477F"];
  const D = { attHist:[], movesHist:[], students:[], enr:[], sched:[], moves:[], att:[], due:[], ms:[], proj:[], hist:[], rec:[], abs:[] };
  const tdUi = { who: null, slot: null, kisSub: "all" };
  const loadIssues = new Set();
  let studentById = new Map(), enrById = new Map(), histBy = new Map();

  /* ---------- time, in the centre's time zone (Philippines) ---------- */
  const manilaNow = () => new Date(Date.now() + 8 * 3600e3);
  const nowMin = () => { const d = manilaNow(); return d.getUTCHours() * 60 + d.getUTCMinutes(); };
  const todayDow = () => DAY_ORDER[(manilaNow().getUTCDay() + 6) % 7];
  const manilaDate = ts => ts ? new Date(Date.parse(ts) + 8 * 3600e3).toISOString().slice(0, 10) : null;
  function mondayOf(isoDate){ const d = new Date(T(isoDate)); const dow = (d.getUTCDay() + 6) % 7; return addDays(isoDate, -dow); }
  const weekStart = () => mondayOf(todayISO());                                   // attendance week (Mon)
  const moveWeek = () => todayDow() === "Sun" ? addDays(todayISO(), 1) : weekStart();   // Sunday shows the coming week
  const toMin = t => { const [h, m] = String(t || "").split(":").map(Number); return h * 60 + (m || 0); };
  const fromMin = x => { x = Math.max(0, Math.min(23 * 60 + 59, x)); return String(Math.floor(x / 60)).padStart(2, "0") + ":" + String(x % 60).padStart(2, "0"); };
  const fmtT = m => { const h = Math.floor(m / 60), mm = m % 60, h12 = h % 12 || 12; return `${h12}${mm ? ":" + String(mm).padStart(2, "0") : ""} ${h >= 12 ? "PM" : "AM"}`; };
  const monthKey = () => todayISO().slice(0, 7);
  const monthEndOf = key => { const [y, m] = key.split("-").map(Number); return iso(Date.UTC(y, m, 0)); };
  const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + "s")}`;

  /* ---------- who is in scope ---------- */
  const isKcE = e => String((e && e.mode) || "").trim().toUpperCase() === "KC";   // Mode on the Student roster, per subject
  const mineEnr = e => e && e.status === "active" && (tdUi.who === "all" || e.teacher === tdUi.who);
  function scopeEnrollments(){ return D.enr.filter(mineEnr); }
  function scopeStudentIds(){ return new Set(scopeEnrollments().map(e => e.student_id)); }
  function nameOf(sid, fallback){ const s = studentById.get(sid); if(!s) return fallback || ""; return [s.first_name, s.last_name].filter(Boolean).join(" ") || s.name || fallback || ""; }
  function firstName(sid){ const s = studentById.get(sid); return (s && (s.first_name || (s.name || "").split(/[ ,]/).filter(Boolean).pop())) || "This child"; }
  const initials = n => String(n || "?").split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join("").toUpperCase();
  const hashN = s => { let h = 0; for(const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
  const avatar = sid => `<span class="td-av" style="background:${AV_COLORS[hashN(sid) % AV_COLORS.length]}" aria-hidden="true">${esc(initials(nameOf(sid)))}</span>`;
  const subjChip = (e, pos) => `<span class="td-chip ${e.subject === "Math" ? "td-math" : "td-read"}">${esc(e.subject)}${pos ? " · " + esc(pos) : ""}</span>`;

  /* ---------- KIS: where a subject stands against the grade line ---------- */
  // The grade a child was in on date d (their grade now, one less for each school year back).
  function gradeAt(g, d){
    const shift = Number(syStartFor(todayISO()).slice(0, 4)) - Number(syStartFor(d).slice(0, 4));
    const i = GRADES.indexOf(g) - shift; return i >= 0 ? GRADES[i] : null;
  }
  function kisAt(subject, g, d){ const gr = gradeAt(g, d); if(!gr) return null; const L = standardLines(subject, gr, syStartFor(d)); return L ? L.kis(d) : null; }
  const levelOfY = y => Math.max(0, Math.ceil(y / 20 - 1e-9) - 1);
  function histOf(eid){ return histBy.get(eid) || []; }   // oldest first
  const kisCache = new Map();
  function kisInfo(e){
    if(kisCache.has(e.id)) return kisCache.get(e.id);
    let out = null;
    const s = studentById.get(e.student_id), g = s ? normGrade(s.age_grade) : "";
    const pos = bestPos(e.subject, e);
    const today = todayISO();
    if(g && gradeIdx(g) && pos){
      const k = kisAt(e.subject, g, today);
      if(k != null){
        const gap = (pos.y - k) / 20;
        // months behind: count closed months (newest first) the child was also below the line at month end
        let months = 0;
        if(gap < 0){
          const hs = histOf(e.id).slice().reverse();
          for(const h of hs){
            const d = monthEndOf(h.cycle_key); if(d >= today) continue;
            const p = bestPos(e.subject, h), kk = kisAt(e.subject, g, d);
            if(!p || kk == null || p.y >= kk) break;
            months++;
          }
        }
        out = { gap, months, now: pos.txt, kis: levelAndPage(e.subject, Math.max(0.1, k)), grade: g };
      }
    }
    kisCache.set(e.id, out); return out;
  }
  // a subject's gap to KIS at each of the last 12 month ends (+ today), for the path chart
  function kisPath(e){
    const s = studentById.get(e.student_id), g = s ? normGrade(s.age_grade) : ""; if(!g) return [];
    const pts = [];
    for(const h of histOf(e.id).slice(-12)){
      const d = monthEndOf(h.cycle_key), p = bestPos(e.subject, h), k = kisAt(e.subject, g, d);
      if(p && k != null) pts.push({ d, gap: (p.y - k) / 20 });
    }
    const info = kisInfo(e); if(info) pts.push({ d: todayISO(), gap: info.gap });
    return pts;
  }

  /* ---------- today's classes (same rules as the Calendar) ---------- */
  function classesToday(){
    const dow = todayDow(), out = [];
    const hasLinked = new Set(D.sched.filter(sc => sc.subject_enrollment_id).map(sc => sc.subject_enrollment_id));
    const seen = new Set();
    for(const sc of D.sched){
      if(sc.subject_enrollment_id){ if(seen.has(sc.subject_enrollment_id)) continue; seen.add(sc.subject_enrollment_id); }
      const enrs = sc.subject_enrollment_id ? D.enr.filter(e => e.id === sc.subject_enrollment_id) : D.enr.filter(e => e.student_id === sc.student_id && !hasLinked.has(e.id));
      const slots = Array.isArray(sc.slots) ? sc.slots : [];
      const firstOn = day => slots.filter(x => x && x.day === day && x.time).map(x => x.time).sort()[0];
      for(const slot of slots){
        if(!slot || !slot.day || !slot.time) continue;
        for(const e of enrs){
          if(!mineEnr(e)) continue;
          const mv = D.moves.find(x => x.schedule_id === sc.id && x.from_day === slot.day);
          const base = { scheduleId: sc.id, origDay: slot.day, e, studentId: e.student_id, mode: slot.mode === "RI" ? "RI" : "IC" };
          if(mv){
            const t = fromMin(toMin(mv.to_time) + toMin(slot.time) - toMin(firstOn(slot.day) || slot.time));
            if(mv.to_day === dow) out.push(Object.assign(base, { time: t, movedFrom: slot.day !== dow ? slot.day : null }));
            else if(slot.day === dow) out.push(Object.assign(base, { time: slot.time, movedTo: mv.to_day }));
          } else if(slot.day === dow) out.push(Object.assign(base, { time: slot.time }));
        }
      }
    }
    return out;
  }
  const arrivedFor = (scheduleId, day) => D.att.some(a => a.schedule_id === scheduleId && a.day === day && a.arrived);
  // classes grouped by start time, one row per child (Math and Reading together)
  function slotsToday(){
    const bySlot = new Map();
    for(const c of classesToday()){
      const m = toMin(c.time); if(!bySlot.has(m)) bySlot.set(m, new Map());
      const kids = bySlot.get(m), k = c.studentId;
      if(!kids.has(k)) kids.set(k, { studentId: k, items: [], movedFrom: null, movedTo: null, arrived: false, ri: false });
      const kid = kids.get(k); kid.items.push(c.e);
      if(c.movedFrom) kid.movedFrom = c.movedFrom; if(c.movedTo) kid.movedTo = c.movedTo;
      if(c.mode === "RI") kid.ri = true;
      if(arrivedFor(c.scheduleId, c.origDay)) kid.arrived = true;
    }
    return [...bySlot.entries()].sort((a, b) => a[0] - b[0]).map(([m, kids]) => ({ m, kids: [...kids.values()].sort((a, b) => nameOf(a.studentId).localeCompare(nameOf(b.studentId))) }));
  }

  /* ---------- what needs you this week ---------- */
  function ptcThisWeek(){
    const ids = scopeStudentIds(), limit = addDays(todayISO(), 6);
    return D.due.filter(d => d.due_date && d.due_date <= limit && (ids.has(d.student_id) || (tdUi.who !== "all" && (d.teachers || []).includes(tdUi.who))))
      .sort((a, b) => a.due_date < b.due_date ? -1 : a.due_date > b.due_date ? 1 : 0);
  }
  function noProjection(){
    const has = new Set(D.proj.map(p => p.subject_enrollment_id));
    return scopeEnrollments().filter(e => !has.has(e.id)).map(e => {
      const s = studentById.get(e.student_id); const since = (s && s.first_day) || String(e.created_at || "").slice(0, 10) || null;
      return { e, since, days: since ? Math.max(0, Math.round((T(todayISO()) - T(since)) / MS_DAY)) : null };
    }).sort((a, b) => (b.days || 0) - (a.days || 0));
  }
  function behindKis(){ return scopeEnrollments().map(e => ({ e, k: kisInfo(e) })).filter(o => o.k && o.k.gap < 0).sort((a, b) => b.k.months - a.k.months || a.k.gap - b.k.gap); }
  const ordinal = n => n + (["th","st","nd","rd"][((n % 100) - 20) % 10] || ["th","st","nd","rd"][n % 100] || "th");

  /* ---------- this month's scorecard (same goals as the monthly sheet) ---------- */
  function scorecard(){
    const ym = monthKey(), mStart = ym + "-01", mEnd = monthEndOf(ym), today = todayISO();
    const enrs = scopeEnrollments(), ids = scopeStudentIds(), studs = [...ids].map(id => studentById.get(id)).filter(Boolean);
    const out = [];
    const metric = (o) => out.push(o);

    // KC: the Mode column on the Student roster, per subject
    const notKc = enrs.filter(e => !isKcE(e));
    metric({ k:"kc", name:"On KC", n: enrs.length - notKc.length, of: enrs.length, goal: 80, unit:"subjects", how:"Subjects whose Mode on the Student roster is KC, out of all active subjects.", missLabel:"Not on KC yet", miss: notKc.map(e => ({ sid: e.student_id, e })) });

    // KIS within 6 months (only subjects that started 6+ months ago and have close-outs from those months)
    const kis6 = { n:0, of:0, miss:[], unknown:0 };
    for(const e of enrs){
      const s = studentById.get(e.student_id), g = s ? normGrade(s.age_grade) : "";
      const start = (s && s.first_day) || String(e.created_at || "").slice(0, 10); if(!start || !g || !gradeIdx(g)) continue;
      const end6 = addMonths(start, 6); if(end6 > today) continue;
      const pts = histOf(e.id).filter(h => monthEndOf(h.cycle_key) <= end6 && monthEndOf(h.cycle_key) >= start);
      if(!pts.length){ kis6.unknown++; continue; }
      kis6.of++;
      const hit = pts.some(h => { const d = monthEndOf(h.cycle_key), p = bestPos(e.subject, h), k = kisAt(e.subject, g, d); return p && k != null && p.y >= k; });
      if(hit) kis6.n++; else kis6.miss.push({ sid: e.student_id, e });
    }
    metric({ k:"kis6", name:"Reached KIS within 6 months", n: kis6.n, of: kis6.of, goal: 100, unit:"subjects",
      how:`Subjects that started 6 or more months ago and reached KIS for their grade within their first 6 months, from each month's close-out.${kis6.unknown ? ` ${plural(kis6.unknown, "subject")} had no close-outs from their first 6 months, so ${kis6.unknown === 1 ? "it isn't" : "they aren't"} counted.` : ""}`,
      missLabel:"Didn't reach KIS in their first 6 months", miss: kis6.miss });

    // Under 2 months on their current level (leaves out subjects still on the first level the Hub knows)
    const lvl = { n:0, of:0, miss:[] };
    for(const e of enrs){
      const pos = bestPos(e.subject, e); if(!pos) continue;
      const li = levelOfY(pos.y); let arrived = null;
      for(const h of histOf(e.id).slice().reverse()){
        const p = bestPos(e.subject, h); if(!p) continue;
        if(levelOfY(p.y) !== li){ arrived = monthEndOf(h.cycle_key); break; }
      }
      if(!arrived) continue;
      lvl.of++; const mo = monthsBetween(arrived, today);
      if(mo < 2) lvl.n++; else lvl.miss.push({ sid: e.student_id, e, note: `${Math.floor(mo)} months on ${bandName(e.subject, pos.y)}` });
    }
    metric({ k:"lvl2", name:"Under 2 months on a level", n: lvl.n, of: lvl.of, goal: 100, unit:"subjects",
      how:"Subjects whose current level has taken under 2 months so far, counted from the month-end they were last on a different level. Subjects still on the first level the Hub knows aren't counted.", missLabel:"2 months or more on their level", miss: lvl.miss });

    // PTC done this month
    const done = D.ms.filter(m => m.status === "done" && String(m.done_on || "").startsWith(ym) && ids.has(m.student_id));
    const late = D.due.filter(d => d.due_date && d.due_date.startsWith(ym) && d.due_date < today && ids.has(d.student_id));
    metric({ k:"ptc", name:"PTC done", n: done.length, of: done.length + late.length, goal: 100, unit:"PTCs",
      how:"PTCs done this month, out of those done plus the ones due this month that are still open past their date.", missLabel:"Overdue PTC", miss: late.map(d => ({ sid: d.student_id, note: `${ordinal(d.month_no)} month · was due ${fmtDate(d.due_date, { year: undefined })}` })) });

    // Achievement tests this cycle: out of every test recorded (not every student), how many came out Group 1
    const filled = v => v != null && String(v).trim() !== "" && String(v).trim() !== "—";
    const tests = enrs.filter(e => filled(e.test_date) || filled(e.test_level) || filled(e.test_score) || filled(e.test_group));
    const g1 = tests.filter(e => /^\s*(group\s*)?1\s*$/i.test(String(e.test_group || "")));
    metric({ k:"at", name:"Achievement test Group 1", n: g1.length, of: tests.length, goal: 100, unit:"tests",
      how:"Achievement tests recorded this cycle (on the Student roster), and how many of them came out Group 1. Counts tests, not students.",
      missLabel:"Not Group 1", miss: tests.filter(e => !g1.includes(e)).map(e => ({ sid: e.student_id, e, note: `${e.test_level ? e.test_level + " test" : "Test"}${filled(e.test_score) ? " · " + e.test_score : ""} · ${filled(e.test_group) ? "Group " + String(e.test_group).replace(/^\s*group\s*/i, "") : "no group yet"}` })) });

    // Absences (lower is better)
    const absIds = new Set();
    for(const a of D.abs){
      if(!ids.has(a.student_id)) continue;
      const on = manilaDate(a.marked_absent_at), back = a.resumed_at ? manilaDate(a.resumed_at) : null;
      if(on && on <= mEnd && (!back || back >= mStart)) absIds.add(a.student_id);
    }
    metric({ k:"abs", name:"Absences", n: absIds.size, of: studs.length, goal: 4, lower: true,
      how:"Students marked absent (on Payments) at any point this month. Lower is better.", missLabel:"Absent this month", miss: [...absIds].map(sid => ({ sid })) });

    // Payments for this month
    const paidOn = new Map();
    for(const r of D.rec){
      if(!ids.has(r.student_id) || !(r.status === "verified" || r.status === "pending") || !String(r.covers_month || "").startsWith(ym)) continue;
      const d = manilaDate(r.created_at); if(!d) continue;
      if(!paidOn.has(r.student_id) || d < paidOn.get(r.student_id)) paidOn.set(r.student_id, d);
    }
    const by25 = studs.filter(s => paidOn.has(s.id) && paidOn.get(s.id) <= ym + "-25");
    metric({ k:"pay25", name:"Paid on or before the 25th", n: by25.length, of: studs.length, goal: 50,
      how:"Families who paid this month's tuition on or before the 25th (verified or waiting for review).", missLabel:"Not paid by the 25th", miss: studs.filter(s => !by25.includes(s)).map(s => ({ sid: s.id, note: paidOn.has(s.id) ? "paid " + fmtDate(paidOn.get(s.id), { year: undefined }) : "not paid yet" })) });
    const byEnd = studs.filter(s => paidOn.has(s.id) && paidOn.get(s.id) <= mEnd);
    metric({ k:"payEnd", name:"Paid before month end", n: byEnd.length, of: studs.length, goal: 90,
      how:"Families who paid this month's tuition within the month (so far).", missLabel:"Not paid yet", miss: studs.filter(s => !byEnd.includes(s)).map(s => ({ sid: s.id })) });

    // Remote at least 2x a month = a weekly RI class on their schedule
    const riIds = new Set();
    for(const sc of D.sched){ const sid = sc.student_id || (enrById.get(sc.subject_enrollment_id) || {}).student_id; if(ids.has(sid) && (sc.slots || []).some(x => x && x.mode === "RI")) riIds.add(sid); }
    metric({ k:"remote", name:"Remote 2× a month", n: riIds.size, of: studs.length, goal: 80,
      how:"Students with a remote (RI) visit on their Calendar schedule — a weekly RI visit comes to 4 a month.", missLabel:"No remote visit", miss: studs.filter(s => !riIds.has(s.id)).map(s => ({ sid: s.id })) });
    return out;
  }
  function metricState(m){
    if(!m.of) return { pct: null, met: false, col: "var(--ink-faint)", text: "Nothing to count yet" };
    const pct = Math.round(m.n / m.of * 100);
    const met = m.lower ? pct <= m.goal : pct >= m.goal;
    const close = !met && (m.lower ? pct <= m.goal * 2 : pct >= m.goal * 0.8);
    return { pct, met, col: met ? "var(--good)" : close ? "var(--warn)" : "var(--bad)",
      text: met ? "Goal met" : close ? "Close" : m.lower ? `${pct - m.goal} points over` : `${m.goal - pct} points to go` };
  }

  /* ---------- drawing helpers ---------- */
  function ring(parts, total, big, small, size){
    size = size || 180; const c = size / 2, R = size * 0.39, sw = size * 0.09, C = 2 * Math.PI * R;
    let off = 0;
    const arcs = parts.map(([n, col]) => { const len = total ? n / total * C : 0; const gapPx = parts.filter(p => p[0]).length > 1 ? 7 : 0;
      const a = n ? `<circle cx="${c}" cy="${c}" r="${R}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${Math.max(0.1, len - gapPx)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 ${c} ${c})"/>` : ""; off += len; return a; }).join("");
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(big)} ${esc(small)}"><circle cx="${c}" cy="${c}" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="${sw}"/>${arcs}

  function renderScore(){

</section>`;

  function renderKis(){
    const pts = scopeEnrollments().filter(e => tdUi.kisSub === "all" || e.subject === tdUi.kisSub).map(e => ({ e, k: kisInfo(e) })).filter(o => o.k);
    // Draw at the real width of the card (no stretching), so dots stay small on big screens.
    const view = $("#view"), W = Math.max(560, Math.round((view ? view.clientWidth : 900) - 50));
    const gaps = pts.map(p => p.k.gap);
    const lo = Math.max(-5, Math.min(-2, Math.floor(Math.min(0, ...gaps)))), hi = Math.min(5, Math.max(2, Math.ceil(Math.max(0, ...gaps))));
    const L = 78, Rr = 30, X = g => L + (Math.max(lo, Math.min(hi, g)) - lo) / (hi - lo) * (W - L - Rr);
    const rows = ["Math", "Reading"].filter(r => tdUi.kisSub === "all" || r === tdUi.kisSub);
    // pile dots that share a spot into a short column above and below the subject's line; squeeze the column if it gets tall
    const R = 5.5, COL = 2 * R + 2, BAND_MAX = 150;
    const bins = new Map();
    for(const p of pts){ const k = p.e.subject + "|" + Math.round(X(p.k.gap) / COL); if(!bins.has(k)) bins.set(k, []); bins.get(k).push(p); }
    const tallest = Math.max(1, ...[...bins.values()].map(a => a.length));
    const step = Math.min(COL, (BAND_MAX - 2 * R) / Math.max(1, tallest - 1));
    const band = Math.min(BAND_MAX, Math.max(60, (tallest - 1) * step + 2 * R + 24));
    const dy = {}, cx = {};
    for(const arr of bins.values()){
      arr.sort((a, c) => a.k.gap - c.k.gap);
      const x0 = Math.round(X(arr[0].k.gap) / COL) * COL;
      arr.forEach((p, n) => { dy[p.e.id] = (n % 2 ? 1 : -1) * Math.ceil(n / 2) * step; cx[p.e.id] = Math.max(L, Math.min(W - Rr, x0)); });
    }
    const H = 26 + rows.length * band + 34;
    const yOf = sub => 26 + rows.indexOf(sub) * band + band / 2;
    const ticks = []; for(let g = lo; g <= hi; g++) ticks.push(g);
    const svg = pts.length ? `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Subjects relative to KIS" style="width:${W}px;max-width:none">

        <text x="${X(g)}" y="${H - 10}" text-anchor="${g === lo ? "start" : g === hi ? "end" : "middle"}" font-size="12" fill="var(--ink-faint)">${g === 0 ? "KIS" : (g > 0 ? "+" : "−") + Math.abs(g) + (g === lo || g === hi ? "+" : "")}</text>`).join("")}
      ${rows.map((n, i) => `${i ? `<line x1="${L}" y1="${26 + i * band}" x2="${W - Rr}" y2="${26 + i * band}" stroke="var(--border)"/>` : ""}<text x="4" y="${yOf(n) + 4}" font-size="12.5" font-weight="600" fill="var(--ink-muted)">${n}</text>`).join("")}
      ${pts.map(p => { const c = p.k.gap >= 0 ? "var(--good)" : p.k.months >= 6 ? "var(--bad)" : "var(--warn)";

    const b = pts.filter(p => p.k.gap < 0), y1 = b.filter(p => p.k.months >= 12).length, m6 = b.filter(p => p.k.months >= 6 && p.k.months < 12).length;

  /* ---------- going deeper: the side panel ---------- */
  const drawerStack = [];
  function ensureDrawer(){

        <line x1="${P}" y1="${Y(0)}" x2="${W - P}" y2="${Y(0)}" stroke="var(--ink-faint)" stroke-width="1.5"/><text x="${W - P}" y="${Y(0) - 6}" text-anchor="end" font-size="11" fill="var(--ink-faint)">KIS</text>

    const worst = enrs.map(e => ({ e, k: kisInfo(e) })).filter(o => o.k).sort((a, b) => a.k.gap - b.k.gap)[0];
    const head = worst ? (worst.k.gap < 0 ? `${esc(firstName(sid))} is behind KIS in ${esc(worst.e.subject)}${worst.k.months ? ` and has been for ${plural(worst.k.months, "month")}` : ""}.` : `${esc(firstName(sid))} is at or ahead of KIS.`) : "";
    return `<div style="display:flex;align-items:center;gap:12px;margin-top:6px">${avatar(sid)}<span class="td-sub">${esc(s && s.age_grade ? normGrade(s.age_grade) : "")}${enrs.length ? " · " + esc([...new Set(enrs.map(e => e.teacher).filter(Boolean))].join(", ")) : ""}${enrs.length ? " · " + esc(enrs.map(e => e.subject + " " + (isKcE(e) ? "KC" : "Paper")).join(", ")) : ""}</span></div>
      <h2>${esc(nameOf(sid))}</h2><p class="dek">${head}</p>
      <div class="td-facts"><div><small>Today</small><b>${kid ? (kid.movedTo ? "Moved to " + esc(kid.movedTo) : kid.arrived ? "Arrived" : "Center visit at " + fmtT(slotOf.m)) : "No center visit"}</b></div>
        <div><small>Next PTC</small><b style="${due && due.due_date < todayISO() ? "color:var(--bad)" : ""}">${due ? (due.due_date < todayISO() ? "Overdue" : esc(fmtDate(due.due_date, { year: undefined }))) : "—"}</b></div>

  /* ---------- loading ---------- */
  async function tdLoad(key, fn){ try{ await fn(); loadIssues.delete(key); }catch(e){ console.warn("today load", key, e); loadIssues.add(key); } }
  async function loadAll(){
    const wk = weekStart(), legacy = addDays(wk, -1);
    await Promise.all([
      tdLoad("students", async () => { D.students = await selectAll("students", "id,name,first_name,last_name,age_grade,mode,status,first_day", q => q.order("id")); }),
      tdLoad("enrollments", async () => { D.enr = await selectAll("subject_enrollments", "id,student_id,student_name,subject,teacher,status,current_level,current_page,lwc,created_at,mode,test_date,test_level,test_score,test_group", q => q.eq("status", "active").order("id")); }),
      tdLoad("schedules", async () => { D.sched = await selectAll("schedules", "id,student_id,subject_enrollment_id,slots,status", q => q.eq("status", "active").order("id")); }),
      tdLoad("history", async () => { D.hist = await selectAll("enrollment_monthly_history", "id,subject_enrollment_id,cycle_key,current_level,current_page,lwc", q => q.order("id")); }),
      tdLoad("projections", async () => { D.proj = await selectAll("study_projections", "subject_enrollment_id", q => q.order("subject_enrollment_id")); }),
      tdLoad("PTC", async () => { const r = await sbClient.rpc("ptc_due", { p_days_ahead: 7 }); if(r.error) throw r.error; D.due = r.data || []; }),
      tdLoad("PTC done", async () => { D.ms = await selectAll("ptc_milestones", "student_id,month_no,due_date,status,done_on", q => q.gte("done_on", monthKey() + "-01").order("student_id")); }),
      tdLoad("payments", async () => { D.rec = await selectAll("payment_receipts", "student_id,covers_month,status,created_at", q => q.gte("covers_month", monthKey() + "-01").lte("covers_month", monthEndOf(monthKey())).order("student_id")); }),
      tdLoad("absences", async () => { D.abs = await selectAll("absence_records", "student_id,subject_enrollment_ids,marked_absent_at,resumed_at", q => q.order("marked_absent_at")); }),
      loadToday()
    ]);
    // moves and arrivals are optional extras: a failed load just means none show
    studentById = new Map(D.students.map(s => [s.id, s]));
    enrById = new Map(D.enr.map(e => [e.id, e]));
    histBy = new Map();
    for(const h of D.hist){ if(!h.cycle_key) continue; (histBy.get(h.subject_enrollment_id) || histBy.set(h.subject_enrollment_id, []).get(h.subject_enrollment_id)).push(h); }
    for(const a of histBy.values()) a.sort((x, y) => x.cycle_key < y.cycle_key ? -1 : 1);
    void legacy;

  // the parts that change during the day: this week's moves and arrived ticks
  async function loadToday(){
    const wk = weekStart();
    await tdLoad("arrivals", async () => {
      const rows = await selectAll("schedule_attendance", "schedule_id,day,week_start,arrived", q => q.in("week_start", [wk, addDays(wk, -1)]).order("schedule_id"));
      const byKey = new Map(); rows.sort((a, b) => (a.week_start === wk) - (b.week_start === wk)).forEach(r => byKey.set(r.schedule_id + "|" + r.day, r)); D.att = [...byKey.values()];
    });
    await tdLoad("moves", async () => {
      try{ D.moves = await selectAll("schedule_moves", "schedule_id,week_start,from_day,to_day,to_time", q => q.eq("week_start", moveWeek()).order("schedule_id")); }
      catch(e){ if(/does not exist|schema cache/i.test(String(e.message || ""))){ D.moves = []; return; } throw e; }
    });
    // the last 8 weeks of visits (came / picked up) and reschedules, for "no worksheets at home"
    const from = addDays(wk, -HIST_WEEKS * 7 - 1);
    await tdLoad("visit history", async () => { D.attHist = await selectAll("schedule_attendance", "*", q => q.gte("week_start", from).order("week_start")); });
    await tdLoad("reschedule history", async () => {
      try{ D.movesHist = await selectAll("schedule_moves", "schedule_id,week_start,from_day,to_day", q => q.gte("week_start", from).order("week_start")); }
      catch(e){ if(/does not exist|schema cache/i.test(String(e.message || ""))){ D.movesHist = []; return; } throw e; }
    });
    wsHomeCache = null;
  }

  /* ---------- worksheets at home ----------
     Worksheets are handed out at every visit (or picked up by a parent) and last until the next visit.
     A visit that passes with no tick, no pick-up and no reschedule leaves the child without worksheets from
     that day until they next come in or someone picks up. Built from the last 8 weeks of the Calendar. */
  const HIST_WEEKS = 8;
  const PICKUP_TRACKING_FROM = "2026-11-09";   // the week "Picked up" was added (phase119) — earlier misses can't be told apart from pick-ups
  let wsHomeCache = null;
  function withoutWorksheets(){
    if(wsHomeCache) return wsHomeCache;
    const today = todayISO(), att = D.attHist || [], moves = D.movesHist || [];
    // tracking starts with the first week anyone ticked anything — before that the Hub can't know
    const firstTick = att.reduce((m, r) => (!m || r.week_start < m) ? r.week_start : m, null);
    const trackFrom = firstTick && firstTick > PICKUP_TRACKING_FROM ? firstTick : PICKUP_TRACKING_FROM;
    // days someone ticked or marked anything — a day with no marks at all means nobody was keeping track, not that everyone missed
    const markedDays = new Set();
    for(const r of att){ if(!(r.arrived || r.picked_up)) continue; const wk0 = DAY_ORDER.indexOf(r.day) < 0 ? null : r.week_start;
      if(!wk0) continue; const mon = new Date(T(wk0)).getUTCDay() === 0 ? addDays(wk0, 1) : wk0; markedDays.add(addDays(mon, DAY_ORDER.indexOf(r.day))); }
    const out = [];
    if(!trackFrom){ wsHomeCache = out; return out; }
    const onLeave = new Set(D.abs.filter(a => !a.resumed_at).map(a => a.student_id));
    const byKid = new Map();
    for(const e of scopeEnrollments()){ if(isKcE(e)) continue; (byKid.get(e.student_id) || byKid.set(e.student_id, []).get(e.student_id)).push(e); }
    const schedFor = e => D.sched.filter(sc => sc.subject_enrollment_id === e.id || (!sc.subject_enrollment_id && sc.student_id === e.student_id));
    const thisWeek = weekStart();
    for(const [sid, enrs] of byKid){
      if(onLeave.has(sid)) continue;
      const s = studentById.get(sid), start = [trackFrom, (s && s.first_day) || ""].sort().pop();
      const scheds = [...new Set(enrs.flatMap(schedFor))]; if(!scheds.length) continue;
      const ids = new Set(scheds.map(x => x.id));
      const visits = new Map();   // date -> { came, picked }
      for(let w = 0; w <= HIST_WEEKS; w++){
        const wk = addDays(thisWeek, -7 * w);
        for(const sc of scheds){
          for(const slot of (sc.slots || [])){
            if(!slot || !slot.day || DAY_ORDER.indexOf(slot.day) < 0) continue;
            const mv = moves.find(m => m.schedule_id === sc.id && m.week_start === wk && m.from_day === slot.day);
            const date = addDays(wk, DAY_ORDER.indexOf(mv ? mv.to_day : slot.day));
            if(date < start || date > today) continue;
            const recs = att.filter(r => ids.has(r.schedule_id) && r.day === slot.day && (r.week_start === wk || r.week_start === addDays(wk, -1)));
            const v = visits.get(date) || { came: false, picked: false, rows: [] };
            v.rows.push({ schedule_id: sc.id, day: slot.day, week_start: wk });
            if(recs.some(r => r.arrived)) v.came = true; if(recs.some(r => r.picked_up)) v.picked = true;
            visits.set(date, v);
          }
        }
      }
      const dates = [...visits.keys()].sort();
      let lastGot = null; for(const d of dates){ const v = visits.get(d); if(v.came || v.picked) lastGot = d; }
      // the first visit after the last hand-out that has already passed with nothing marked
      const missed = dates.filter(d => (!lastGot || d > lastGot) && d < today && markedDays.has(d) && !visits.get(d).came && !visits.get(d).picked);
      if(!missed.length) continue;
      const since = missed[0];
      const last = missed[missed.length - 1];
      out.push({ sid, since, days: Math.round((T(today) - T(since)) / MS_DAY), missedVisits: missed.length, lastGot, sure: !!lastGot, enrs, lastMissed: last, lastRows: visits.get(last).rows });
    }
    out.sort((a, b) => b.days - a.days);
    wsHomeCache = out; return out;
  }

  /* ---------- marking a child from the "without worksheets" list (same rows the Calendar uses) ---------- */
  let marking = false;
  async function markVisit(sid, kind){
    const o = withoutWorksheets().find(x => x.sid === sid); if(!o || marking) return;
    marking = true; document.querySelectorAll(`[data-mark][data-sid="${CSS.escape(sid)}"]`).forEach(b => b.disabled = true);
    const at = new Date().toISOString(), by = currentUser ? (currentUser.email || null) : null;
    const payload = o.lastRows.map(r => { const cur = (D.attHist || []).find(a => a.schedule_id === r.schedule_id && a.day === r.day && a.week_start === r.week_start) || {};
      return kind === "picked"
        ? { schedule_id: r.schedule_id, day: r.day, week_start: r.week_start, arrived: !!cur.arrived, picked_up: true, picked_up_at: at, picked_up_by: by }
        : { schedule_id: r.schedule_id, day: r.day, week_start: r.week_start, arrived: true, arrived_at: at }; });
    let error = null;
    for(let attempt = 0; attempt < 3; attempt++){
      ({ error } = await sbClient.from("schedule_attendance").upsert(payload, { onConflict: "schedule_id,day,week_start" }));
      if(!error) break;
      if(/jwt|token|expired|401/i.test(String(error.message || ""))){ try{ await sbClient.auth.refreshSession(); }catch(_){ } }
      await new Promise(r => setTimeout(r, 600 * (attempt + 1)));
    }
    marking = false;
    const name = nameOf(sid), when = new Date(T(o.lastMissed)).toLocaleDateString("en-US", { timeZone: "UTC", weekday: "short", month: "short", day: "numeric" });
    if(error){
      console.warn(error); document.querySelectorAll(`[data-mark][data-sid="${CSS.escape(sid)}"]`).forEach(b => b.disabled = false);
      toast(/row-level security|permission/i.test(String(error.message || "")) ? "Couldn't save — this student isn't in your group's list. Ask an admin." : "Couldn't save — check the connection and try again.");
      return;
    }
    logHistory(kind === "picked" ? "worksheets_picked_up" : "toggle_arrived", kind === "picked" ? `Marked ${name}'s worksheets picked up for ${when} (from Today)` : `Marked ${name} arrived for ${when} (from Today)`, o.lastRows[0].schedule_id);
    toast(kind === "picked" ? `${name}: worksheets picked up (${when}).` : `${name}: marked as came on ${when}.`);
    await loadToday(); render();
  }

  /* ---------- actions ---------- */
  document.addEventListener("click", (e) => {
    const mk = e.target.closest("[data-mark]"); if(mk){ e.stopPropagation(); if(!mk.disabled) markVisit(mk.dataset.sid, mk.dataset.mark); return; }
    const sl = e.target.closest("[data-slot]"); if(sl){ tdUi.slot = Number(sl.dataset.slot); render(); return; }
    const ks = e.target.closest("[data-kissub]"); if(ks){ tdUi.kisSub = ks.dataset.kissub; render(); return; }
    const st = e.target.closest("[data-story]"); if(st){ openDrawer({ type: "story", k: st.dataset.story }); return; }
    const mt = e.target.closest("[data-metric]"); if(mt){ openDrawer({ type: "metric", k: mt.dataset.metric }); return; }
    if(e.target.closest("a")) return;
    const kd = e.target.closest("[data-kid]"); if(kd){ openDrawer({ type: "kid", id: kd.dataset.kid }); return; }
    if(e.target.closest("#tdClose") || e.target.id === "tdScrim"){ closeDrawer(); return; }
    if(e.target.closest("#tdBack")){ drawerStack.pop(); drawerStack.length ? paintDrawer() : closeDrawer(); return; }
  });
  document.addEventListener("keydown", (e) => {
    if(e.key === "Escape" && drawerStack.length){ closeDrawer(); return; }
    if((e.key === "Enter" || e.key === " ") && e.target.closest){ const kd = e.target.closest("[data-kid]"); if(kd && !e.target.closest("button, a")){ e.preventDefault(); openDrawer({ type: "kid", id: kd.dataset.kid }); } }
  });
  let resizeT = null, lastW = 0;
  window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => { const v = $("#view"); if(!v || !started) return; if(Math.abs(v.clientWidth - lastW) > 40){ lastW = v.clientWidth; render(); } }, 200); });
  document.addEventListener("change", (e) => {
    if(e.target.id === "tdWho"){ tdUi.who = e.target.value; tdUi.slot = null; try{ sessionStorage.setItem("kumonTodayWho", tdUi.who); }catch(_){ } render(); }
  });

  let started = false, refreshTimer = null;
  async function startApp(){
    if(started || !isAuthorized()) return;
    started = true;
    if(isAdmin()){ let saved = null; try{ saved = sessionStorage.getItem("kumonTodayWho"); }catch(_){ } tdUi.who = saved || "all"; }
    else tdUi.who = currentTeacherName || null;
    $("#view").innerHTML = `<div class="empty">Loading your day…</div>`;
    await loadAll();
    render();
    // classes, arrivals and moves change during the day: refresh them every 2 minutes and when the tab comes back
    const tick = async () => { if(document.hidden || drawerStack.length) return; await loadToday(); render(); };
    refreshTimer = setInterval(tick, 2 * 60 * 1000);
    document.addEventListener("visibilitychange", () => { if(!document.hidden) tick(); });
  }
  document.addEventListener("submit", async (e)=>{
    if(e.target.id === "loginForm"){ e.preventDefault(); const fd = new FormData(e.target);
      const { error } = await sbClient.auth.signInWithPassword({ email: fd.get("email"), password: fd.get("password") }); if(error) showLogin(error.message); }
  });
  document.addEventListener("click", (e) => { if(e.target.closest('[data-action="logout"]') && sbClient){ sbClient.auth.signOut(); } });
  window.__today = { scorecard, slotsToday, kisInfo, behindKis, noProjection, ptcThisWeek, D, tdUi, render };   // for tests
  boot();
})();
</script>
<script>
(function(){
  var KEY = "kumonRailCollapsed", root = document.documentElement;
  function apply(c){
    root.classList.toggle("rail-collapsed", c);
    var b = document.getElementById("railToggle");
    if(b){ var t = c ? "Expand sidebar" : "Collapse sidebar"; b.title = t; b.setAttribute("aria-label", t); b.setAttribute("aria-expanded", String(!c)); }
  }
  apply(root.classList.contains("rail-collapsed"));
  var b = document.getElementById("railToggle");
  if(b) b.addEventListener("click", function(){
    var c = !root.classList.contains("rail-collapsed"); apply(c);
    try{ localStorage.setItem(KEY, c ? "1" : "0"); }catch(e){}
  });
  // Collapsed rail is icons only, so every link gets a tooltip with its name.
  document.querySelectorAll(".rail .navbtn").forEach(function(a){
    if(a.title) return;
    var t = (a.textContent || "").replace(/\s+/g, " ").trim().replace(/\s*\d+$/, "");
    if(t) a.title = t;
  });
  // The Pipeline views group follows the same who-can-see-Pipeline flag as the single Pipeline link.
  var link = document.getElementById("navPipelineLink"), grp = document.getElementById("navPipelineGroup");
  if(link && grp){
    var sync = function(){ grp.hidden = link.hidden; };
    sync(); new MutationObserver(sync).observe(link, { attributes:true, attributeFilter:["hidden"] });
  }
})();
</script>
